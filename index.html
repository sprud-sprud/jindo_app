// ---------- 컴시간 알리미 엑셀 시간표 불러오기 ----------
// 학교/버전마다 내보내기 형식이 조금씩 달라서, 세 가지 흔한 형태를 순서대로 시도한다.
// 1) 전체시간표 그리드: '요일/교시' 열 + 학년-반이 가로로 쭉 나열되고, 칸 안에 '과목\n교사명'이 들어있는 형태 (학교 전체시간표에서 흔함)
// 2) 행 기반 표: 교사/요일/교시/과목/반 같은 열이 있는 목록형 시트
// 3) 격자형 표: 월화수목금 열 + 교시 행으로 된 단순 그리드형 시트 (개인 주간시간표에서 흔함)

// 1번 형태 전용 파서. '요일'/'교시' 헤더가 있는 행을 찾고, 그 바로 위 행에서 학년(1학년/2학년...),
// 바로 아래 행에서 반 번호(1~9)를 읽어 각 열이 몇 학년 몇 반인지 알아낸다.
// 학년/요일 칸은 엑셀에서 병합돼있어서 빈 칸이 나오면 바로 왼쪽(또는 위) 값을 그대로 이어서 쓴다(carry-forward).
function parseFullSchoolGrid(rows){
  var headerRow1 = -1;
  for(var r=0; r<Math.min(rows.length,12); r++){
    var row = rows[r]||[];
    var c0 = String(row[0]||'').split(/\r?\n/)[0].trim();
    var c1 = String(row[1]||'').split(/\r?\n/)[0].trim();
    if(c0==='요일' && c1==='교시'){ headerRow1 = r; break; }
  }
  if(headerRow1===-1) return null;
  var headerRow2 = headerRow1+1;
  var gradeRow = rows[headerRow1]||[];
  var classRow = rows[headerRow2]||[];
  var maxCol = 0;
  rows.forEach(function(row){ if(row && row.length>maxCol) maxCol = row.length; });

  var colLabel = {};
  var lastGrade = '';
  for(var c=2; c<maxCol; c++){
    var g = String(gradeRow[c]||'').split(/\r?\n/)[0].trim();
    if(g) lastGrade = g;
    var cls = String(classRow[c]||'').split(/\r?\n/)[0].trim();
    if(lastGrade && cls) colLabel[c] = lastGrade+' '+cls+'반';
  }
  if(!Object.keys(colLabel).length) return null;

  var entries = [];
  var teacherSet = {};
  var lastDay = '';
  for(var r2=headerRow2+1; r2<rows.length; r2++){
    var row2 = rows[r2];
    if(!row2) continue;
    var dRaw = String(row2[0]||'').split(/\r?\n/)[0].replace('요일','').trim();
    if(dRaw && DAYS.indexOf(dRaw)!==-1) lastDay = dRaw;
    var pRaw = String(row2[1]||'').trim();
    var period = parseInt(pRaw.replace(/[^0-9]/g,''),10);
    if(!lastDay || !period) continue;
    for(var c2=2; c2<maxCol; c2++){
      if(!colLabel[c2]) continue;
      var cellRaw = String(row2[c2]||'').trim();
      if(!cellRaw) continue;
      var parts = cellRaw.split(/\r?\n/);
      var subject = (parts[0]||'').trim();
      var teacher = (parts[1]||'').trim();
      if(!subject) continue;
      if(teacher) teacherSet[teacher] = true;
      entries.push({ teacher:teacher, day:lastDay, period:period, label:colLabel[c2] });
    }
  }
  return { entries: entries, teachers: Object.keys(teacherSet) };
}

function parseGamsiganWorkbook(wb){
  var allEntries = [];
  var teacherSet = {};
  wb.SheetNames.forEach(function(sheetName){
    var sheet = wb.Sheets[sheetName];
    var rows;
    try{ rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false}); }catch(e){ return; }
    if(!rows || !rows.length) return;

    var gridResult = parseFullSchoolGrid(rows);
    if(gridResult && gridResult.entries.length){
      gridResult.entries.forEach(function(en){ allEntries.push(en); });
      gridResult.teachers.forEach(function(t){ teacherSet[t] = true; });
      return;
    }

    var headerRowIdx = -1, colIdx = {};
    for(var r=0; r<Math.min(rows.length, 10); r++){
      var row = rows[r] || [];
      var teacherCol=-1, dayCol=-1, periodCol=-1, subjectCol=-1, classCol=-1;
      row.forEach(function(cell, c){
        var v = String(cell||'').trim();
        if((v==='교사'||v==='성명'||v==='교사명') && teacherCol===-1) teacherCol=c;
        if(v==='요일' && dayCol===-1) dayCol=c;
        if(v==='교시' && periodCol===-1) periodCol=c;
        if((v==='과목'||v==='과목명') && subjectCol===-1) subjectCol=c;
        if((v==='반'||v==='학급') && classCol===-1) classCol=c;
      });
      if(dayCol!==-1 && periodCol!==-1){
        headerRowIdx = r;
        colIdx = { teacher:teacherCol, day:dayCol, period:periodCol, subject:subjectCol, cls:classCol };
        break;
      }
    }
    if(headerRowIdx!==-1){
      for(var r2=headerRowIdx+1; r2<rows.length; r2++){
        var row2 = rows[r2];
        if(!row2 || !row2.length) continue;
        var dayVal = String(row2[colIdx.day]||'').trim().replace('요일','');
        var periodVal = parseInt(String(row2[colIdx.period]||'').replace(/[^0-9]/g,''),10);
        if(DAYS.indexOf(dayVal)===-1 || !periodVal) continue;
        var teacherVal = colIdx.teacher!==-1 ? String(row2[colIdx.teacher]||'').trim() : '';
        var subjectVal = colIdx.subject!==-1 ? String(row2[colIdx.subject]||'').trim() : '';
        var classVal = colIdx.cls!==-1 ? String(row2[colIdx.cls]||'').trim() : '';
        var label = (classVal || subjectVal || '수업').trim();
        if(subjectVal && classVal) label = classVal+' '+subjectVal;
        if(teacherVal) teacherSet[teacherVal] = true;
        allEntries.push({ teacher:teacherVal, day:dayVal, period:periodVal, label:label });
      }
      return;
    }

    var dayHeaderRow = -1, dayColMap = {};
    for(var r3=0; r3<Math.min(rows.length, 10); r3++){
      var row3 = rows[r3] || [];
      var found = 0, map3 = {};
      row3.forEach(function(cell, c){
        var v = String(cell||'').trim().replace('요일','');
        if(DAYS.indexOf(v)!==-1){ map3[c]=v; found++; }
      });
      if(found>=3){ dayHeaderRow = r3; dayColMap = map3; break; }
    }
    if(dayHeaderRow===-1) return;
    for(var r4=dayHeaderRow+1; r4<rows.length; r4++){
      var row4 = rows[r4];
      if(!row4 || !row4.length) continue;
      var periodMatch = String(row4[0]||'').match(/\d+/);
      if(!periodMatch) continue;
      var period4 = parseInt(periodMatch[0],10);
      Object.keys(dayColMap).forEach(function(cKey){
        var c = parseInt(cKey,10);
        var raw = String(row4[c]||'').trim();
        if(!raw) return;
        allEntries.push({ teacher:'', day:dayColMap[c], period:period4, label:raw.replace(/\n/g,' ').trim() });
      });
    }
  });
  return { entries: allEntries, teachers: Object.keys(teacherSet) };
}

function openGamsiganUploadFlow(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', function(){
    var file = input.files[0];
    input.remove();
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:'array'});
        var parsed = parseGamsiganWorkbook(wb);
        if(!parsed.entries.length){
          alert('시간표 형식을 인식하지 못했어요. 컴시간 알리미에서 내보낸 "교사별 시간표" 엑셀 파일이 맞는지 확인해주세요.');
          return;
        }
        if(parsed.teachers.length>1){
          openTeacherSelectModal(parsed.teachers, function(teacherName){
            var filtered = parsed.entries.filter(function(en){ return en.teacher===teacherName; });
            openGamsiganPreviewModal(filtered);
          });
        } else {
          openGamsiganPreviewModal(parsed.entries);
        }
      }catch(err){
        console.error(err);
        alert('파일을 읽는 중 문제가 생겼어요. 엑셀 파일(.xlsx/.xls)이 맞는지 확인해주세요.');
      }
    };
    reader.readAsArrayBuffer(file);
  });
  input.click();
}

    '<p class="small-note" style="margin:0 0 12px;">전체 교사 시간표 파일이라, 선생님 이름에 해당하는 시간표만 가져올게요.</p>'+

  '</div>';

function openGamsiganPreviewModal(entries){
  var labelMap = {};
  entries.forEach(function(en){
    if(!labelMap[en.label]) labelMap[en.label] = { label:en.label, count:0 };
    labelMap[en.label].count++;
  });
  var labels = Object.keys(labelMap).map(function(k){ return labelMap[k]; });
  labels.sort(function(a,b){ return b.count-a.count; });

  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var rows = labels.map(function(l){
    return '<div class="add-row" style="margin-bottom:6px;align-items:center;">'+
      '<label class="check on" style="flex-shrink:0;padding:7px 8px;"><input type="checkbox" class="gs-label-chk" data-label="'+escapeHtml(l.label)+'" checked><span class="mark"></span></label>'+
      '<input type="text" class="gs-label-name" data-orig="'+escapeHtml(l.label)+'" value="'+escapeHtml(l.label)+'" style="flex:1;">'+
      '<span class="small-note" style="flex-shrink:0;">'+l.count+'회</span>'+
    '</div>';
  }).join('');
  overlay.innerHTML = '<div class="modal-box">'+
    '<h3>시간표 불러오기 확인</h3>'+
    '<p class="small-note" style="margin:0 0 10px;">엑셀에서 이런 반/과목이 발견됐어요. 반으로 등록할 항목만 체크하고, 필요하면 이름을 반 이름에 맞게 고쳐주세요.</p>'+
    '<div style="max-height:280px;overflow-y:auto;">'+rows+'</div>'+
    '<p class="small-note" style="margin:10px 0 0;color:var(--coral-deep);">적용하면 지금 등록된 시간표는 덮어써져요.</p>'+
    '<div class="modal-actions"><button class="btn ghost small" id="gsCancel">취소</button><button class="btn small" id="gsApply">시간표에 적용</button></div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('.gs-label-chk').forEach(function(chk){
    chk.addEventListener('change', function(){ chk.closest('.check').classList.toggle('on', chk.checked); });
  });
  overlay.querySelector('#gsCancel').addEventListener('click', function(){ overlay.remove(); });
  overlay.querySelector('#gsApply').addEventListener('click', function(){
    var included = {};
    overlay.querySelectorAll('.gs-label-chk').forEach(function(chk){
      if(chk.checked) included[chk.getAttribute('data-label')] = true;
    });
    var nameMap = {};
    overlay.querySelectorAll('.gs-label-name').forEach(function(inp){
      nameMap[inp.getAttribute('data-orig')] = inp.value.trim() || inp.getAttribute('data-orig');
    });
    applyGamsiganEntries(entries, included, nameMap);
    overlay.remove();
  });
}

function applyGamsiganEntries(entries, included, nameMap){
  var nameToId = {};
  state.settings.classes.forEach(function(c){ nameToId[c.name] = c.id; });
  var maxPeriod = state.settings.periodsPerDay || 7;
  entries.forEach(function(en){
    if(!included[en.label]) return;
    var finalName = nameMap[en.label] || en.label;
    var classId = nameToId[finalName];
    if(!classId){
      classId = uid();
      var color = CLASS_COLORS[state.settings.classes.length % CLASS_COLORS.length];
      state.settings.classes.push({ id:classId, name:finalName, color:color, grade:'' });
      state.plans[classId] = [];
      nameToId[finalName] = classId;
    }
    if(!state.settings.schedule[en.day]) state.settings.schedule[en.day] = [];
    var arr = state.settings.schedule[en.day];
    while(arr.length < en.period) arr.push(null);
    arr[en.period-1] = classId;
    if(en.period > maxPeriod) maxPeriod = en.period;
  });
  state.settings.periodsPerDay = Math.min(10, maxPeriod);
  Promise.all([saveSettings(), savePlans()]).then(function(){
    var b = document.getElementById('settingsBody');
    if(b) renderSettingsTimetable(b);
    flashSaved();
    alert('시간표를 불러왔어요. 반 이름·색상은 "반 목록"에서 다시 확인해보세요.');
  });
}

function bindDataEvents(body){
  document.getElementById('exportBtn').addEventListener('click', function(){
    exportExcel(this);
  });
  document.getElementById('planTemplateBtn').addEventListener('click', function(){
    downloadExcelTemplate();
  });
  document.getElementById('planImportBtn').addEventListener('click', function(){
    document.getElementById('planImportFileInput').click();
  });
  document.getElementById('planImportFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    var isCsv = /\.csv$/i.test(file.name);
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var wb = isCsv ? XLSX.read(ev.target.result, {type:'string'}) : XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        var sheet = wb.Sheets[wb.SheetNames[0]];
        var rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
        applyPlanImportRows(rows);
      }catch(err){
        console.error(err);
        alert('파일을 읽는 중 문제가 생겼어요. 엑셀(.xlsx) 또는 CSV 파일이 맞는지 확인해주세요.');
      }
    };
    if(isCsv) reader.readAsText(file, 'UTF-8'); else reader.readAsArrayBuffer(file);
  });
  document.getElementById('backupExportBtn').addEventListener('click', function(){
    exportJSONBackup(this);
  });
  document.getElementById('backupImportBtn').addEventListener('click', function(){
    document.getElementById('backupFileInput').click();
  });
  document.getElementById('backupFileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    importJSONBackup(file);
    e.target.value = '';
  });
  document.getElementById('exportCodeBtn').addEventListener('click', function(){
    exportViaCode(this, document.getElementById('exportCodeResult'));
  });
  document.getElementById('importCodeBtn').addEventListener('click', function(){
    var code = document.getElementById('importCodeInput').value;
    importViaCode(this, code, document.getElementById('importCodeResult'));
  });
  document.getElementById('resetAllBtn').addEventListener('click', function(){
    if(!confirm('정말 모든 데이터를 초기화할까요? 되돌릴 수 없어요.')) return;
    state.settings = defaultSettings();
    state.plans = {};
    state.monthCache = {};
    Promise.all([saveSettings(), savePlans()]).then(function(){
      renderAll();
    });
  });
}

function bindClassesEvents(body){
  body.querySelectorAll('.cls-name').forEach(function(inp){
    inp.addEventListener('change', function(){
      var c = getClass(inp.getAttribute('data-id'));
      if(c){ c.name = inp.value || c.name; saveSettings().then(function(){ flashSaved(); }); }
    });
  });
  body.querySelectorAll('.cls-grade').forEach(function(inp){
    inp.addEventListener('change', function(){
      var c = getClass(inp.getAttribute('data-id'));
      if(c){ c.grade = inp.value.trim(); saveSettings().then(function(){ flashSaved(); }); }
    });
  });
  body.querySelectorAll('.del').forEach(function(x){
    x.addEventListener('click', function(){
      var id = x.getAttribute('data-id');
      if(!confirm('이 반을 삭제할까요? 진도 계획도 함께 삭제돼요.')) return;
      state.settings.classes = state.settings.classes.filter(function(c){ return c.id!==id; });
      DAYS.forEach(function(d){
        state.settings.schedule[d] = state.settings.schedule[d].map(function(cid){ return cid===id?null:cid; });
      });
      delete state.plans[id];
      Promise.all([saveSettings(), savePlans()]).then(function(){ renderSettingsTimetable(body); flashSaved(); });
    });
  });
  var addClassBtn = document.getElementById('addClassBtn');
  if(addClassBtn) addClassBtn.addEventListener('click', function(){
    var input = document.getElementById('newClassName');
    var gradeInput = document.getElementById('newClassGrade');
    var name = input.value.trim();
    if(!name) return;
    var color = CLASS_COLORS[state.settings.classes.length % CLASS_COLORS.length];
    var id = uid();
    state.settings.classes.push({ id:id, name:name, color:color, grade: gradeInput.value.trim() });
    state.plans[id] = [];
    input.value=''; gradeInput.value='';
    Promise.all([saveSettings(), savePlans()]).then(function(){ renderSettingsTimetable(body); flashSaved(); });
  });
}

function buildMyTimetableHtml(){
  var n = state.settings.periodsPerDay;
  var html = '<div class="settings-section"><h3>시간표</h3>';
  html += '<div class="field-row" style="max-width:160px;"><label>하루 교시 수</label>'+
    '<input type="text" id="periodsInput" value="'+n+'" inputmode="numeric"></div>';
  if(state.settings.classes.length===0){
    html += '<p class="small-note">먼저 반을 등록해주세요.</p></div>';
    return html;
  }
  html += '<div class="sched-scroll"><table class="sched-table"><thead><tr><th></th>';
  DAYS.forEach(function(d){ html += '<th>'+d+'</th>'; });
  html += '</tr></thead><tbody>';
  for(var p=0; p<n; p++){
    var pt = computePeriodTime(p);
    html += '<tr><th>'+(p+1)+'교시<div class="sub" style="font-weight:400;">'+pt.start+'~'+pt.end+'</div></th>';
    DAYS.forEach(function(d){
      var val = state.settings.schedule[d][p] || '';
      html += '<td><select data-day="'+d+'" data-period="'+p+'"><option value="">-</option>';
      state.settings.classes.forEach(function(c){
        html += '<option value="'+c.id+'"'+(val===c.id?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
      });
      html += '</select></td>';
    });
    html += '</tr>';
    if(state.settings.lunchAfterPeriod===(p+1)){
      var lp = computePeriodTime(p+1);
      var lunchStart = pt.end;
      html += '<tr class="lunch-row"><td colspan="'+(DAYS.length+1)+'">점심시간 · '+lunchStart+'~'+lp.start+'</td></tr>';
    }
  }
  html += '</tbody></table></div></div>';
  html += '<div class="settings-section"><h3>내 시간표</h3>'+
    '<p class="small-note">지금 등록된 시간표를 깔끔한 이미지로 저장해서 바탕화면에 두거나 인쇄할 수 있어요.</p>'+
    renderPrettyTimetable()+
  '</div>';
  return html;
}

function bindMyTimetableEvents(body){
  var saveTimetableBtn = document.getElementById('saveTimetableImgBtn');
  if(saveTimetableBtn) saveTimetableBtn.addEventListener('click', saveTimetableImage);
  var periodsInput = document.getElementById('periodsInput');
  if(!periodsInput) return;
  periodsInput.addEventListener('change', function(){
    var v = Math.max(1, Math.min(10, parseInt(this.value,10)||7));
    state.settings.periodsPerDay = v;
    DAYS.forEach(function(d){
      var arr = state.settings.schedule[d];
      while(arr.length<v) arr.push(null);
      arr.length = v;
    });
    saveSettings().then(function(){ renderSettingsTimetable(body); flashSaved(); });
  });
  body.querySelectorAll('select[data-day]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var d = sel.getAttribute('data-day'), p = parseInt(sel.getAttribute('data-period'),10);
      state.settings.schedule[d][p] = sel.value || null;
      saveSettings().then(flashSaved);
    });
  });
}

function renderSettingsCalendar(body){
  if(!state.academicSubTab){
    renderDrillMenu(body, [
      ['writtenExam','지필평가','중간·기말고사 등록'],
      ['mock','모의고사','모의고사 일정 등록'],
      ['performance','수행평가','수행평가 일정 등록'],
      ['event','학교행사','학교 행사 일정 등록'],
      ['calendar','학기·휴업일','학기 기간, 공휴일 설정'],
      ['neis','나이스 불러오기','학사일정 자동으로 불러오기']
    ], function(key){ state.academicSubTab = key; renderSettingsCalendar(body); });
    return;
  }
  var titles = { writtenExam:'지필평가', mock:'모의고사', performance:'수행평가', event:'학교행사', calendar:'학기·휴업일', neis:'나이스 불러오기' };
  var html = '<div class="settings-back sub-back">‹ 학사일정</div>'+
    '<h2 style="margin:2px 0 14px;font-size:1.0625rem;">'+titles[state.academicSubTab]+'</h2>'+
    '<div id="academicBody"></div>';
  body.innerHTML = html;
  body.querySelector('.sub-back').addEventListener('click', function(){ state.academicSubTab = null; renderSettingsCalendar(body); });
  var sub = document.getElementById('academicBody');
  if(state.academicSubTab==='calendar') renderSettingsSemesterHoliday(sub);
  else if(state.academicSubTab==='neis') renderSettingsNeis(sub);
  else renderSettingsExamType(sub, state.academicSubTab);
}

var examSlotDraft = [];

function renderSettingsExamType(body, type){
  var isSlotBased = (type==='performance');
  var isRange = (type==='writtenExam' || type==='event');
  var isGradeBased = (type==='event');
  var distinctGrades = [];
  state.settings.classes.forEach(function(c){ if(c.grade && distinctGrades.indexOf(c.grade)===-1) distinctGrades.push(c.grade); });
  var html = '<div class="settings-section"><h3>'+EXAM_TYPES[type]+'</h3>';
  if(type==='performance'){
    html += '<p class="small-note">반마다 날짜와 교시가 다르면 아래에서 반 일정을 한 줄씩 추가하세요 (한 번에 여러 반 등록 가능). 교시를 지정하면 그 교시 수업만 빠지고 같은 날 다른 교시는 평소대로 진도를 기록할 수 있어요. 교시를 비워두면 그 반은 그 날 전체가 빠져요.</p>';
  }
  if(type==='event'){
    html += '<p class="small-note">재량휴업일, 수련회, 수학여행, 체육대회 등 학교 행사를 자유롭게 등록하세요. 대상 학년을 고르면 해당 학년 반들만 수업일수 계산에서 제외돼요.</p>';
  }
  var sortedExamsOfType = state.settings.exams.filter(function(e){ return e.type===type; })
    .slice().sort(function(a,b){ return a.startDate<b.startDate?-1:1; });
  sortedExamsOfType.forEach(function(e, eIdx){
      if(isSlotBased && e.slots && e.slots.length){
        var chunk = e.slots.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).map(function(s){
          var c = getClass(s.classId);
          var per = (s.period!=null) ? (' '+s.period+'교시') : '';
          return (c?c.name:'')+' '+niceDate(s.date)+per;
        }).join(', ');
        html += '<div class="list-row"><div class="grow">'+escapeHtml(e.name)+'<div class="sub">'+chunk+'</div></div>'+
          '<span class="del-exam" data-id="'+e.id+'">✕</span></div>';
        return;
      }
      var dateLabel = e.startDate===e.endDate ? niceDate(e.startDate) : (niceDate(e.startDate)+' ~ '+niceDate(e.endDate));
      var targetLabel;
      if(isGradeBased){
        targetLabel = (e.grades && e.grades.length) ? (' · '+e.grades.join(', ')) : (distinctGrades.length ? ' · 전체 학년' : '');
      } else {
        targetLabel = (e.classIds && e.classIds.length) ? (' · '+e.classIds.map(function(id){
          var c=getClass(id); if(!c) return '';
          var per = (e.periodsByClass && e.periodsByClass[id]!=null) ? (' '+e.periodsByClass[id]+'교시') : '';
          return c.name+per;
        }).filter(Boolean).join(', ')) : (state.settings.classes.length>1 ? ' · 전체 반' : '');
      }
      if(type==='writtenExam' && e.examTargetOrder){
        var prevExamRow = sortedExamsOfType[eIdx-1] || null;
        var startOrderRow = (prevExamRow && prevExamRow.examTargetOrder) ? prevExamRow.examTargetOrder : 0;
        targetLabel += ' · 목표 '+(startOrderRow+1)+'~'+e.examTargetOrder+'번';
      }
      html += '<div class="list-row"><div class="grow">'+escapeHtml(e.name)+'<div class="sub">'+dateLabel+targetLabel+'</div></div>'+
        (type==='writtenExam' ? ('<span class="edit-exam-target" data-id="'+e.id+'" style="font-size:0.75rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer;margin-right:10px;">진도 목표</span>') : '')+
        '<span class="del-exam" data-id="'+e.id+'">✕</span></div>';
      if(type==='writtenExam' && state.examTargetEditId===e.id){
        var refItemsEdit = referencePlanItems();
        html += '<div class="settings-section" style="margin:-4px 0 12px;background:var(--bg-soft);">'+
          '<p class="small-note" style="margin-top:0;">이 시험까지 몇 번째 진도 항목까지 나가야 하는지 하나만 고르면 모든 반에 똑같이 적용돼요. 바로 앞 지필평가에 목표가 있으면 그 다음 번호부터 자동으로 범위가 잡혀요 (예: 중간고사 목표 5번 → 1~5번, 기말고사 목표 10번 → 6~10번). 고르지 않으면 전체 진도계획 기준으로 계산해요.</p>';
        if(refItemsEdit.length){
          html += '<select class="exam-target-order-select" style="width:100%;margin-bottom:10px;">'+
            '<option value="">자동 (전체 진도 기준)</option>'+
            refItemsEdit.map(function(it,i){ return '<option value="'+(i+1)+'"'+(String(e.examTargetOrder||'')===String(i+1)?' selected':'')+'>'+(i+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' ('+escapeHtml(it.targetPage)+')'):'')+'</option>'; }).join('')+
            '</select>';
        } else {
          html += '<p class="small-note">설정 &gt; 진도계획에서 반별 진도를 먼저 입력하면 목표를 고를 수 있어요.</p>';
        }
        html += '<div style="display:flex;gap:8px;"><button class="btn small save-exam-target-btn" data-id="'+e.id+'">저장</button>'+
          '<button class="btn small ghost cancel-exam-target-btn">취소</button></div></div>';
      }
    });
  var namePlaceholder = type==='writtenExam' ? '1학기 기말고사' : type==='mock' ? '6월 모의고사' : type==='performance' ? '수행 - 발표평가' : '수학여행, 수련회, 재량휴업일 등';
  html += '<div class="field-row"><label>이름 <span class="req">*</span></label><div class="add-row"><input type="text" id="examName" placeholder="예: '+namePlaceholder+'" style="flex:1.3"></div></div>';

  if(isSlotBased){
    if(!state.settings.classes.length){
      html += '<p class="small-note">설정 &gt; 시간표에서 반을 먼저 만들어주세요.</p>';
    } else {
      if(examSlotDraft.length===0) examSlotDraft.push({classId:state.settings.classes[0].id, date:'', period:''});
      html += '<div class="field-row"><label>반 · 날짜 · 교시</label><div id="examSlotRows" style="display:flex;flex-direction:column;gap:8px;">';
      examSlotDraft.forEach(function(slot, idx){
        html += '<div class="slot-row" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">'+
          '<select class="slot-cls" data-idx="'+idx+'" style="flex:1;min-width:88px;">'+
            state.settings.classes.map(function(c){ return '<option value="'+c.id+'"'+(slot.classId===c.id?' selected':'')+'>'+escapeHtml(c.name)+'</option>'; }).join('')+
          '</select>'+
          '<input type="date" class="slot-date" data-idx="'+idx+'" value="'+(slot.date||'')+'" style="flex:1.3;min-width:130px;">'+
          '<select class="slot-period" data-idx="'+idx+'" style="flex:1;min-width:100px;">'+
            '<option value="">교시 미지정</option>'+
            Array.from({length: state.settings.periodsPerDay||7}, function(_,i){ return i+1; }).map(function(p){ return '<option value="'+p+'"'+(String(slot.period)===String(p)?' selected':'')+'>'+p+'교시만</option>'; }).join('')+
          '</select>'+
          '<span class="del-slot-row" data-idx="'+idx+'" style="cursor:pointer;color:var(--rose-deep,#B3435C);padding:4px 8px;font-size:0.875rem;">✕</span>'+
        '</div>';
      });
      html += '</div><button type="button" class="btn ghost small" id="addSlotRowBtn" style="margin-top:6px;">+ 반 일정 추가</button></div>';
    }
  } else if(isRange){
    html += '<div class="field-row"><label>시작일 <span class="req">*</span> ~ 종료일 <span class="req">*</span></label><div class="add-row"><input type="date" id="examStart"><span style="align-self:center;color:var(--ink-soft);">~</span><input type="date" id="examEnd"></div></div>'+
      '<p class="small-note">여러 날 연달아 진행되면 시작일과 종료일을 함께 선택하세요. 하루면 같은 날짜를 두 번 선택하면 돼요.</p>';
  } else {
    html += '<div class="field-row"><label>날짜 <span class="req">*</span></label><div class="add-row"><input type="date" id="examStart"></div></div>';
  }

  if(!isSlotBased){
    if(isGradeBased){
      if(distinctGrades.length){
        html += '<div class="field-row"><label>대상 학년 (선택 안 하면 전체 학년 적용)</label><div style="display:flex;flex-wrap:wrap;gap:6px;">';
        distinctGrades.forEach(function(g){
          html += '<label class="check" style="font-size:0.7812rem;padding:6px 10px;"><input type="checkbox" class="exam-grade-chk" value="'+escapeHtml(g)+'"><span class="mark"></span>'+escapeHtml(g)+'</label>';
        });
        html += '</div></div>';
      } else {
        html += '<p class="small-note">설정 &gt; 시간표에서 반마다 학년을 적어두면, 이 행사가 특정 학년만 대상인지 고를 수 있어요. (지금은 전체 학년에 적용돼요)</p>';
      }
    } else if(state.settings.classes.length){
      html += '<div class="field-row"><label>적용 반 (선택 안 하면 전체 반 일괄 등록)</label><div style="display:flex;flex-wrap:wrap;gap:6px;">';
      state.settings.classes.forEach(function(c){
        html += '<label class="check" style="font-size:0.7812rem;padding:6px 10px;"><input type="checkbox" class="exam-cls-chk" value="'+c.id+'"><span class="mark"></span>'+escapeHtml(c.name)+'</label>';
      });
      html += '</div></div>';
    }
  }

  if(type==='writtenExam' && state.settings.classes.length){
    var refItemsNew = referencePlanItems();
    html += '<div class="field-row"><label>진도 목표 (선택, 전체 반 공통)</label>'+
      '<p class="small-note" style="margin:2px 0 8px;">이 시험까지 나가야 할 마지막 진도 항목을 하나만 고르면, 전체 진도계획이 아니라 그 범위 기준으로 진도가 여유로운지 빠듯한지 계산해요. 반마다 세부 내용은 달라도 진도 순서는 보통 같이 가니까 반별로 따로 고를 필요 없어요. 비워두면 전체 진도계획 기준으로 계산돼요.</p>';
    if(refItemsNew.length){
      html += '<select id="examTargetOrder" style="width:100%;">'+
        '<option value="">자동 (전체 진도 기준)</option>'+
        refItemsNew.map(function(it,i){ return '<option value="'+(i+1)+'">'+(i+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' ('+escapeHtml(it.targetPage)+')'):'')+'</option>'; }).join('')+
        '</select>';
    } else {
      html += '<p class="small-note">설정 &gt; 진도계획에서 반별 진도를 먼저 입력하면 목표를 고를 수 있어요.</p>';
    }
    html += '</div>';
  }


  html += '<button class="btn small" id="addExamBtn" style="margin-top:8px;">추가</button></div>';
  body.innerHTML = html;

  body.querySelectorAll('.exam-cls-chk, .exam-grade-chk').forEach(function(chk){
    chk.addEventListener('change', function(){ chk.closest('.check').classList.toggle('on', chk.checked); });
  });

  if(isSlotBased && state.settings.classes.length){
    body.querySelectorAll('.slot-cls').forEach(function(sel){
      sel.addEventListener('change', function(){ examSlotDraft[+sel.getAttribute('data-idx')].classId = sel.value; });
    });
    body.querySelectorAll('.slot-date').forEach(function(inp){
      inp.addEventListener('change', function(){ examSlotDraft[+inp.getAttribute('data-idx')].date = inp.value; });
    });
    body.querySelectorAll('.slot-period').forEach(function(sel){
      sel.addEventListener('change', function(){ examSlotDraft[+sel.getAttribute('data-idx')].period = sel.value; });
    });
    body.querySelectorAll('.del-slot-row').forEach(function(x){
      x.addEventListener('click', function(){
        examSlotDraft.splice(+x.getAttribute('data-idx'), 1);
        renderSettingsExamType(body, type);
      });
    });
    var addSlotBtn = document.getElementById('addSlotRowBtn');
    if(addSlotBtn) addSlotBtn.addEventListener('click', function(){
      examSlotDraft.push({classId: state.settings.classes[0].id, date:'', period:''});
      renderSettingsExamType(body, type);
    });
  }

  body.querySelectorAll('.del-exam').forEach(function(x){
    x.addEventListener('click', function(){
      var id = x.getAttribute('data-id');
      if(!confirm('이 일정을 삭제할까요?')) return;
      var removed = state.settings.exams.find(function(e){ return e.id===id; });
      state.settings.exams = state.settings.exams.filter(function(e){ return e.id!==id; });
      saveSettings().then(function(){
        renderSettingsExamType(body, type); flashSaved();
        if(removed){
          showUndoToast('"'+removed.name+'" 삭제됨', function(){
            state.settings.exams.push(removed);
            saveSettings().then(function(){ renderSettingsExamType(body, type); flashSaved(); });
          });
        }
      });
    });
  });

  body.querySelectorAll('.edit-exam-target').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      state.examTargetEditId = (state.examTargetEditId===id) ? null : id;
      renderSettingsExamType(body, type);
    });
  });
  body.querySelectorAll('.save-exam-target-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.getAttribute('data-id');
      var ex = state.settings.exams.find(function(x){ return x.id===id; });
      if(!ex) return;
      var sel = body.querySelector('.exam-target-order-select');
      if(sel && sel.value) ex.examTargetOrder = parseInt(sel.value,10);
      else delete ex.examTargetOrder;
      delete ex.examTargets; // 예전 반별 지정 방식은 더 이상 쓰지 않음
      state.examTargetEditId = null;
      saveSettings().then(function(){ renderSettingsExamType(body, type); flashSaved(); });
    });
  });
  body.querySelectorAll('.cancel-exam-target-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.examTargetEditId = null;
      renderSettingsExamType(body, type);
    });
  });

  document.getElementById('addExamBtn').addEventListener('click', function(){
    var name = document.getElementById('examName').value.trim();
    if(!name) return;

    if(isSlotBased){
      var finalSlots = examSlotDraft.filter(function(s){ return s.classId && s.date; }).map(function(s){
        return { classId:s.classId, date:s.date, period: s.period ? parseInt(s.period,10) : null };
      });
      if(!finalSlots.length){ alert('반과 날짜를 최소 하나 이상 입력해주세요.'); return; }
      var dates = finalSlots.map(function(s){ return s.date; });
      var newSlotExam = { id:uid(), type:type, name:name, slots:finalSlots,
        startDate: dates.reduce(function(a,b){ return a<b?a:b; }),
        endDate: dates.reduce(function(a,b){ return a>b?a:b; }) };
      state.settings.exams.push(newSlotExam);
      examSlotDraft = [];
      saveSettings().then(function(){ renderSettingsExamType(body, type); flashSaved(); });
      return;
    }

    var start = document.getElementById('examStart').value;
    var endEl = document.getElementById('examEnd');
    var end = endEl ? (endEl.value || start) : start;
    if(!start) return;
    if(end < start){ var t=start; start=end; end=t; }
    var newExam = { id:uid(), type:type, name:name, startDate:start, endDate:end };
    if(type==='writtenExam'){
      var targetSel = document.getElementById('examTargetOrder');
      if(targetSel && targetSel.value) newExam.examTargetOrder = parseInt(targetSel.value,10);
    }
    if(isGradeBased){
      newExam.grades = Array.prototype.slice.call(body.querySelectorAll('.exam-grade-chk:checked')).map(function(c){ return c.value; });
    } else {
      newExam.classIds = Array.prototype.slice.call(body.querySelectorAll('.exam-cls-chk:checked')).map(function(c){ return c.value; });
    }
    state.settings.exams.push(newExam);
    saveSettings().then(function(){ renderSettingsExamType(body, type); flashSaved(); });
  });
}

function renderNeisEventsList(body){
  var listEl = document.getElementById('neisEventsList');
  if(!listEl) return;
  var today = todayStr();
  var items = (state.settings.neisHolidays||[]).filter(function(h){ return h.date >= today; })
    .slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  if(!items.length){
    listEl.innerHTML = '<p class="small-note">불러온 일정이 없어요.</p>';
    return;
  }
  var html = '';
  items.forEach(function(h){
    var isHoliday = h.classified==='holiday';
    html += '<div class="list-row neis-event-row"><div class="grow">'+niceDate(h.date)+' ('+dayKorOf(h.date)+') · '+escapeHtml(h.name)+
      (h.sbtr?(' <span class="sub">나이스 분류: '+escapeHtml(h.sbtr)+'</span>'):'')+
      (h.grades&&h.grades.length?(' <span class="sub">'+h.grades.join(', ')+'</span>'):'')+
      '</div>'+
      '<div class="neis-classify">'+
        '<span class="neis-classify-btn'+(!isHoliday?' active':'')+'" data-date="'+h.date+'" data-val="event">행사</span>'+
        '<span class="neis-classify-btn'+(isHoliday?' active':'')+'" data-date="'+h.date+'" data-val="holiday">휴업일</span>'+
      '</div>'+
      '<span class="del-neis-h" data-date="'+h.date+'">✕</span></div>';
  });
  listEl.innerHTML = html;
  listEl.querySelectorAll('.neis-classify-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var dt = btn.getAttribute('data-date'), val = btn.getAttribute('data-val');
      var entry = (state.settings.neisHolidays||[]).find(function(h){ return h.date===dt; });
      if(entry){ entry.classified = val; }
      saveSettings().then(function(){
        renderNeisEventsList(body);
        renderHolidayMergedList(body);
        flashSaved();
      });
    });
  });
  listEl.querySelectorAll('.del-neis-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      state.settings.neisHolidays = (state.settings.neisHolidays||[]).filter(function(h){ return h.date!==dt; });
      saveSettings().then(function(){ renderNeisEventsList(body); renderHolidayMergedList(body); flashSaved(); });
    });
  });
}

function renderHolidayMergedList(body){
  var listEl = document.getElementById('holidayMergedList');
  if(!listEl) return;
  var today = todayStr();
  var merged = [];
  state.settings.holidays.forEach(function(h){ merged.push({ date:h, name:'직접 등록', source:'custom' }); });
  if(state.settings.autoHolidaysEnabled){
    LEGAL_HOLIDAYS.forEach(function(h){
      if(h.date >= today && state.settings.holidayExceptions.indexOf(h.date)===-1) merged.push({ date:h.date, name:h.name, source:'auto' });
    });
  }
  if(state.settings.autoSuneungEnabled){
    var thisYear = parseInt(today.slice(0,4),10);
    [0,1].forEach(function(offset){
      var y = thisYear+offset;
      var d = suneungDate(y);
      if(d >= today && state.settings.holidayExceptions.indexOf(d)===-1) merged.push({ date:d, name:'대학수학능력시험일 ('+y+')', source:'auto' });
    });
  }
  (state.settings.neisHolidays||[]).forEach(function(h){
    if(h.date < today || h.classified!=='holiday') return;
    merged.push({ date:h.date, name:h.name+(h.grades&&h.grades.length?(' · '+h.grades.join(',')):''), source:'neis' });
  });
  merged.sort(function(a,b){ return a.date<b.date?-1:1; });
  var html = '<p class="small-note" style="margin-top:0;">오늘 이후 일정만 보여드려요. (나이스로 불러온 항목 중 "휴업일"로 지정한 것만 여기 표시돼요 — 전체 목록은 아래 "나이스에서 불러온 일정"에서 볼 수 있어요.)</p>';
  merged.forEach(function(h){
    var delClass = h.source==='auto' ? 'del-auto-h' : (h.source==='neis' ? 'del-neis-h' : 'del-h');
    var tag = h.source==='auto' ? ' <span class="sub">자동</span>' : (h.source==='neis' ? ' <span class="sub">나이스</span>' : '');
    html += '<div class="list-row"><div class="grow">'+niceDate(h.date)+' ('+dayKorOf(h.date)+') · '+escapeHtml(h.name)+tag+'</div>'+
      '<span class="'+delClass+'" data-date="'+h.date+'">✕</span></div>';
  });
  var excluded = state.settings.holidayExceptions.filter(function(d){ return LEGAL_HOLIDAYS.some(function(h){return h.date===d;}) || d===suneungDate(parseInt(d.slice(0,4),10)); });
  if(excluded.length){
    html += '<p class="small-note" style="margin-top:10px;">제외한 공휴일</p>';
    excluded.sort().forEach(function(d){
      var h = findAutoHoliday(d);
      var nm = h ? h.name : '대학수학능력시험일';
      html += '<div class="list-row" style="opacity:.6;"><div class="grow">'+niceDate(d)+' · '+escapeHtml(nm)+'</div>'+
        '<span class="restore-h" data-date="'+d+'" style="font-size:0.75rem;text-decoration:underline;cursor:pointer;color:var(--coral-deep);">복원</span></div>';
    });
  }
  if(!merged.length) html += '<p class="small-note">등록된 휴업일이 없어요.</p>';
  listEl.innerHTML = html;

  listEl.querySelectorAll('.del-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      if(!confirm('이 휴업일을 삭제할까요?')) return;
      state.settings.holidays = state.settings.holidays.filter(function(h){ return h!==dt; });
      saveSettings().then(function(){
        renderHolidayMergedList(body); flashSaved();
        showUndoToast(niceDate(dt)+' 삭제됨', function(){
          if(state.settings.holidays.indexOf(dt)===-1) state.settings.holidays.push(dt);
          saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
        });
      });
    });
  });
  listEl.querySelectorAll('.del-auto-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      if(state.settings.holidayExceptions.indexOf(dt)===-1) state.settings.holidayExceptions.push(dt);
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
    });
  });
  listEl.querySelectorAll('.del-neis-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      state.settings.neisHolidays = (state.settings.neisHolidays||[]).filter(function(h){ return h.date!==dt; });
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); renderNeisEventsList(body); });
    });
  });
  listEl.querySelectorAll('.restore-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      state.settings.holidayExceptions = state.settings.holidayExceptions.filter(function(d){ return d!==dt; });
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
    });
  });
}

// 다른 반 진도계획을 통째로 말고, 원하는 항목만 골라서 복사해올 수 있게 하는 모달.
function openCopyPlanModal(fromId, toId, onDone){
  var srcItems = state.plans[fromId] || [];
  if(!srcItems.length){ alert('복사할 진도 항목이 없어요.'); return; }
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var rows = srcItems.map(function(it, i){
    return '<label class="check copy-item-chk-row on" style="width:100%;box-sizing:border-box;justify-content:flex-start;margin-bottom:2px;">'+
      '<input type="checkbox" class="copy-item-chk" value="'+it.id+'" checked><span class="mark"></span>'+
      (i+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' ('+escapeHtml(it.targetPage)+')'):'')+
    '</label>';
  }).join('');
  overlay.innerHTML = '<div class="modal-box">'+
    '<h3>복사할 항목 선택</h3>'+
    '<p class="small-note" style="margin:0 0 10px;">체크한 항목만 지금 반 뒤에 이어 붙여요.</p>'+
    '<div style="margin-bottom:8px;"><span id="copySelectAll" style="font-size:0.75rem;color:var(--coral-deep);text-decoration:underline;cursor:pointer;">전체 선택/해제</span></div>'+
    '<div style="max-height:280px;overflow-y:auto;">'+rows+'</div>'+
    '<div class="modal-actions"><button class="btn ghost small" id="copyPlanCancel">취소</button><button class="btn small" id="copyPlanConfirm">선택 복사</button></div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#copyPlanCancel').addEventListener('click', function(){ overlay.remove(); });
  overlay.querySelectorAll('.copy-item-chk').forEach(function(chk){
    chk.addEventListener('change', function(){ chk.closest('.copy-item-chk-row').classList.toggle('on', chk.checked); });
  });
  var allOn = true;
  overlay.querySelector('#copySelectAll').addEventListener('click', function(){
    allOn = !allOn;
    overlay.querySelectorAll('.copy-item-chk').forEach(function(chk){
      chk.checked = allOn;
      chk.closest('.copy-item-chk-row').classList.toggle('on', allOn);
    });
  });
  overlay.querySelector('#copyPlanConfirm').addEventListener('click', function(){
    var checkedIds = Array.prototype.slice.call(overlay.querySelectorAll('.copy-item-chk:checked')).map(function(c){ return c.value; });
    if(!checkedIds.length){ alert('복사할 항목을 하나 이상 선택해주세요.'); return; }
    var copied = srcItems.filter(function(it){ return checkedIds.indexOf(it.id)!==-1; }).map(function(it){
      return { id:uid(), title:it.title, targetPage:it.targetPage||'', done:false, status:'pending', doneDate:null, donePage:'' };
    });
    if(!state.plans[toId]) state.plans[toId] = [];
    state.plans[toId] = state.plans[toId].concat(copied);
    savePlans().then(function(){
      overlay.remove();
      flashSaved();
      onDone();
    });
  });
}

function renderSettingsPlans(body){
  if(state.settings.classes.length===0){
    body.innerHTML = '<p class="small-note">먼저 반을 등록해주세요.</p>';
    return;
  }
  if(!state.planClassId || !getClass(state.planClassId)){
    state.planClassId = state.settings.classes[0].id;
  }
  var html = '<div class="tab-pills">';
  state.settings.classes.forEach(function(c){
    html += '<div class="tab-pill'+(state.planClassId===c.id?' active':'')+'" data-cid="'+c.id+'" style="'+(state.planClassId===c.id?('background:'+c.color+'22;color:'+c.color+';border-color:'+c.color):'')+'">'+escapeHtml(c.name)+'</div>';
  });
  html += '</div>';
  var otherClasses = state.settings.classes.filter(function(c){ return c.id!==state.planClassId; });
  if(otherClasses.length){
    html += '<div class="settings-section"><h3>다른 반 계획 복사</h3>';
    html += '<p class="small-note">다른 반과 진도 계획이 같다면, 여기서 불러와 지금 반 목록 뒤에 이어 붙여요.</p>';
    html += '<div class="add-row"><select id="copyFromClass">';
    otherClasses.forEach(function(c){ html += '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; });
    html += '</select><button class="btn ghost small" id="copyPlanBtn">복사해오기</button></div></div>';
  }
  html += '<div class="settings-section"><h3>진도 계획 순서</h3>';
  html += '<p class="small-note">단원/차시 순서대로 미리 입력해두면, [오늘] 화면에서 항목을 골라 체크할 수 있어요.</p>';
  var items = state.plans[state.planClassId] || [];
  items.forEach(function(it, idx){
    html += '<div class="list-row plan-item-row'+(it.done?' done':'')+'">';
    html += '<div class="updown"><span data-act="up" data-id="'+it.id+'">▲</span><span data-act="down" data-id="'+it.id+'">▼</span></div>';
    html += '<div class="grow">'+(idx+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' <span class="sub">('+escapeHtml(it.targetPage)+')</span>'):'')+'</div>';
    html += '<span class="del-item" data-id="'+it.id+'">✕</span></div>';
  });
  html += '<div class="add-row"><input type="text" id="planTitle" placeholder="예: 2단원 이차방정식" style="flex:1.4">'+
    '<input type="text" id="planPage" placeholder="목표쪽수" style="max-width:90px"></div>'+
    '<button class="btn small" id="addPlanBtn" style="margin-top:8px;">항목 추가</button></div>';
  body.innerHTML = html;

  body.querySelectorAll('.tab-pill').forEach(function(p){
    p.addEventListener('click', function(){ state.planClassId = p.getAttribute('data-cid'); renderSettingsPlans(body); });
  });
  var copyBtn = document.getElementById('copyPlanBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      var fromId = document.getElementById('copyFromClass').value;
      openCopyPlanModal(fromId, state.planClassId, function(){ renderSettingsPlans(body); });
    });
  }
  body.querySelectorAll('.del-item').forEach(function(x){
    x.addEventListener('click', function(){
      var arr = state.plans[state.planClassId];
      state.plans[state.planClassId] = arr.filter(function(i){ return i.id!==x.getAttribute('data-id'); });
      savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
    });
  });
  body.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var arr = state.plans[state.planClassId];
      var id = btn.getAttribute('data-id');
      var i = arr.findIndex(function(x){ return x.id===id; });
      var dir = btn.getAttribute('data-act')==='up'?-1:1;
      var j = i+dir;
      if(j<0||j>=arr.length) return;
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
      savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
    });
  });
  document.getElementById('addPlanBtn').addEventListener('click', function(){
    var title = document.getElementById('planTitle').value.trim();
    var page = document.getElementById('planPage').value.trim();
    if(!title) return;
    if(!state.plans[state.planClassId]) state.plans[state.planClassId]=[];
    state.plans[state.planClassId].push({ id:uid(), title:title, targetPage:page, done:false, status:'pending', doneDate:null, donePage:'' });
    savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
  });
}

function switchView(name){
  state.currentView = name;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active','in'); });
  var target = document.getElementById('view-'+name);
  target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view')===name);
  });
  if(name==='today') renderToday();
  else if(name==='calendar') renderCalendar();
  else if(name==='classes') renderClasses();
  else if(name==='exam') renderExam();
  else if(name==='settings'){ state.settingsTab = null; state.scheduleSubTab = null; state.academicSubTab = null; renderSettings(); }
  // 탭을 눌렀을 때 화면이 훅 바뀌지 않고 살짝 떠오르듯 전환되도록 (네이티브 앱 느낌)
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ target.classList.add('in'); });
  });
}
window.__gotoView = switchView;

document.querySelectorAll('.nav-btn').forEach(function(b){

function hideSplash(){
  // Capacitor 네이티브 스플래시가 따로 떠있다면 먼저 내려주고, 우리가 만든 체크 애니메이션 스플래시를 보여준 뒤 사라지게 한다.
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen){
      window.Capacitor.Plugins.SplashScreen.hide();

  }catch(e){}
  setTimeout(function(){

    setTimeout(function(){ sp.remove(); }, 500);

}

function shouldShowOnboarding(){
  return !!(state.settings && state.settings.onboardingDone === false);
}

// 설정 > 앱 사용 가이드에서 부르는 진입점: 이미 세팅을 마친 사용자에게도 소개 슬라이드 3장만 다시 보여준다.
function openAppGuide(){

  renderOnboarding(true);
}
function closeAppGuide(){
  onboardingGuideMode = false;
  var ov = document.getElementById('onboardingOverlay');
  if(ov) ov.remove();
}

// 다음/이전 단계로 넘어갈 때 카드가 살짝 아래에서 위로 떠오르며 바뀌는 모션.
function animateOnboardingStep(newStep){
  var ov = document.getElementById('onboardingOverlay');
  var bodyEl = ov ? ov.querySelector('.onboarding-body') : null;
  if(!bodyEl){ onboardingStep = newStep; renderOnboarding(true); return; }
  bodyEl.style.transition = 'opacity .18s ease, transform .18s ease';
  bodyEl.style.opacity = '0';
  bodyEl.style.transform = 'translateY(12px)';
  setTimeout(function(){
    onboardingStep = newStep;
    renderOnboarding(true);
    var newOv = document.getElementById('onboardingOverlay');
    var newBody = newOv ? newOv.querySelector('.onboarding-body') : null;
    if(newBody){
      newBody.style.transition = 'none';
      newBody.style.opacity = '0';
      newBody.style.transform = 'translateY(12px)';
      void newBody.offsetWidth; // 강제 리플로우로 위 상태를 확정시킨 뒤에 트랜지션을 다시 켠다
      newBody.style.transition = 'opacity .35s ease, transform .35s ease';
      requestAnimationFrame(function(){
        newBody.style.opacity = '1';
        newBody.style.transform = 'translateY(0)';
      });
    }
  }, 160);
}
// 온보딩 카드 위에서 좌우로 스와이프하면 지금 보이는 다음/이전 버튼을 그대로 눌러준다
// (버튼마다 단계별 저장 로직이 다 달라서, 직접 흉내내지 않고 실제 버튼 클릭을 그대로 재사용한다)
function bindOnboardingSwipe(ov){
  var startX=0, startY=0, tracking=false;
  ov.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  ov.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var endX = e.changedTouches[0].clientX, endY = e.changedTouches[0].clientY;
    var dx = endX-startX, dy = endY-startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    if(dx < 0){
      var nextBtn = ov.querySelector('#obNext') || ov.querySelector('#obGotoSchedule');
      if(nextBtn) nextBtn.click();
    } else {
      var backBtn = ov.querySelector('#obBack');
      if(backBtn) backBtn.click();
    }
  }, {passive:true});
}

function renderOnboarding(force){
  if(!force && !shouldShowOnboarding()) return;
  var ov = document.getElementById('onboardingOverlay');
  var isNew = !ov;
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'onboardingOverlay';
    ov.className = 'onboarding-overlay';
    document.body.appendChild(ov);
  }
  var totalSteps = onboardingGuideMode ? 3 : ONBOARDING_TOTAL_STEPS;
  var dots = '<div class="onboarding-dots">';
  for(var i=1;i<=totalSteps;i++){ dots += '<div class="onboarding-dot'+(i===onboardingStep?' active':'')+'"></div>'; }
  dots += '</div>';

  var backLink = onboardingStep>1 ? '<span class="onboarding-back" id="obBack">← 이전</span>' : '';
  var body, actions;

  if(onboardingGuideMode && onboardingStep<=3){
    var gslide = ONBOARDING_INTRO[onboardingStep-1];
    body = '<div class="onboarding-body">'+
      backLink+
      '<div class="onboarding-icon" style="display:flex;align-items:center;justify-content:center;">'+gslide.icon+'</div>'+
      '<div class="onboarding-title">'+gslide.title+'</div>'+
      '<div class="onboarding-desc">'+gslide.desc+'</div>'+
    '</div>';
    var isLastGuide = onboardingStep===3;
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="'+(isLastGuide?'obGuideDone':'obNext')+'" style="width:100%;">'+(isLastGuide?'확인':'다음')+'</button>'+
    '</div>';
  } else if(onboardingStep===1){
    body = '<div class="onboarding-body">'+
      '<svg class="onboarding-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M22,54 L42,74 L80,28" fill="none" stroke="var(--coral-deep)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path></svg>'+
      '<div class="onboarding-title">진도수첩에 오신 걸 환영해요</div>'+
      '<div class="onboarding-desc">반과 시간표, 진도 계획을 등록해두면<br>매일 수업 진도를 훨씬 빠르게 기록할 수 있어요.<br>3분이면 충분해요.</div>'+
    '</div>';
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="obNext" style="width:100%;">시작하기</button>'+
      '<span class="onboarding-skip" id="obSkip">나중에 할게요</span>'+
    '</div>';
  } else if(onboardingStep>=2 && onboardingStep<=4){
    var slide = ONBOARDING_INTRO[onboardingStep-2];
    body = '<div class="onboarding-body">'+
      backLink+
      '<div class="onboarding-icon" style="display:flex;align-items:center;justify-content:center;">'+slide.icon+'</div>'+
      '<div class="onboarding-title">'+slide.title+'</div>'+
      '<div class="onboarding-desc">'+slide.desc+'</div>'+
    '</div>';
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="obNext" style="width:100%;">다음</button>'+
      '<span class="onboarding-skip" id="obSkip">나중에 할게요</span>'+
    '</div>';
  } else if(onboardingStep===5){
    var chips = state.settings.classes.map(function(c){
      return '<span class="onboarding-class-chip">'+escapeHtml(c.name)+(c.grade?(' · '+escapeHtml(c.grade)):'')+'<span class="x" data-id="'+c.id+'">✕</span></span>';
    }).join('');
    body = '<div class="onboarding-body">'+
      backLink+
      '<div class="onboarding-title">담당하시는 반을 등록해주세요</div>'+
      '<div class="onboarding-desc">나중에 설정에서 언제든 추가·수정할 수 있어요.</div>'+
      '<div class="add-row" style="margin-top:16px;">'+
        '<input type="text" id="obClassName" placeholder="반 이름 (예: 2학년 3반)" style="flex:2;">'+
        '<input type="text" id="obClassGrade" placeholder="학년 (선택)" style="flex:1;">'+
      '</div>'+
      '<button class="btn ghost small" id="obAddClass" style="width:100%;margin-top:8px;">+ 반 추가</button>'+
      '<div class="onboarding-class-list">'+chips+'</div>'+
    '</div>';
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="obNext" style="width:100%;">다음</button>'+
      '<span class="onboarding-skip" id="obSkip">나중에 할게요</span>'+
    '</div>';
  } else if(onboardingStep===6){
    var lvl = state.settings.schoolLevel||'high';
    body = '<div class="onboarding-body">'+
      backLink+
      '<div class="onboarding-title">일과시간을 설정해주세요</div>'+
      '<div class="onboarding-desc">학교급을 고르면 수업시간이 자동으로 채워져요.</div>'+
      '<div class="field-row" style="margin-top:16px;"><label>학교급</label><select id="obSchoolLevel">'+
        '<option value="elementary"'+(lvl==='elementary'?' selected':'')+'>초등학교 (40분)</option>'+
        '<option value="middle"'+(lvl==='middle'?' selected':'')+'>중학교 (45분)</option>'+
        '<option value="high"'+(lvl==='high'?' selected':'')+'>고등학교 (50분)</option>'+
        '<option value="custom"'+(lvl==='custom'?' selected':'')+'>직접 입력</option>'+
      '</select></div>'+
      '<div class="field-row"><label>1교시 시작 시각</label><input type="time" id="obFirstPeriod" value="'+escapeHtml(state.settings.firstPeriodStart)+'"></div>'+
    '</div>';
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="obNext" style="width:100%;">다음</button>'+
      '<span class="onboarding-skip" id="obSkip">나중에 할게요</span>'+
    '</div>';
  } else {
    body = '<div class="onboarding-body">'+
      backLink+
      '<div class="onboarding-title">이제 시간표랑 진도계획만 채우면 끝이에요</div>'+
      '<div class="onboarding-desc">요일별로 몇 교시에 어떤 반 수업이 있는지, 각 반은 어떤 순서로 진도를 나갈지 설정에서 입력해주세요. 컴시간 엑셀을 올리면 시간표는 한 번에 채워져요.</div>'+
    '</div>';
    actions = '<div class="onboarding-actions">'+
      '<button class="btn" id="obGotoSchedule" style="width:100%;">시간표 설정하러 가기</button>'+
      '<button class="btn ghost" id="obGotoPlans" style="width:100%;">진도계획 입력하러 가기</button>'+
      '<span class="onboarding-skip" id="obSkip">나중에 하고 오늘 화면으로 갈게요</span>'+
    '</div>';
  }

  ov.innerHTML = dots + body + actions;
  bindOnboardingEvents(ov);
  if(isNew) bindOnboardingSwipe(ov);
}
function bindOnboardingEvents(ov){
  var backBtn = ov.querySelector('#obBack');
  if(backBtn) backBtn.onclick = function(){ animateOnboardingStep(onboardingStep-1); };
  var skipBtn = ov.querySelector('#obSkip');
  if(skipBtn) skipBtn.onclick = function(){ finishOnboarding(); };
  var guideDoneBtn = ov.querySelector('#obGuideDone');
  if(guideDoneBtn) guideDoneBtn.onclick = function(){ closeAppGuide(); };
  var nextBtn = ov.querySelector('#obNext');
  if(nextBtn) nextBtn.onclick = function(){
    if(onboardingStep===6){
      var lvlSel = ov.querySelector('#obSchoolLevel');
      var firstInput = ov.querySelector('#obFirstPeriod');
      state.settings.schoolLevel = lvlSel.value;
      if(lvlSel.value !== 'custom' && SCHOOL_LEVEL_DURATION[lvlSel.value]) state.settings.classDuration = SCHOOL_LEVEL_DURATION[lvlSel.value];
      state.settings.firstPeriodStart = firstInput.value || '09:00';
      saveSettings();
    }
    animateOnboardingStep(onboardingStep+1);
  };
  var addClassBtn = ov.querySelector('#obAddClass');
  if(addClassBtn) addClassBtn.onclick = function(){
    var nameInput = ov.querySelector('#obClassName');
    var gradeInput = ov.querySelector('#obClassGrade');
    var name = nameInput.value.trim();
    if(!name) return;
    var color = CLASS_COLORS[state.settings.classes.length % CLASS_COLORS.length];
    var id = uid();
    state.settings.classes.push({ id:id, name:name, color:color, grade: gradeInput.value.trim() });
    state.plans[id] = [];
    nameInput.value=''; gradeInput.value='';
    Promise.all([saveSettings(), savePlans()]).then(function(){ renderOnboarding(true); });
  };
  ov.querySelectorAll('.onboarding-class-chip .x').forEach(function(x){
    x.onclick = function(){
      var id = x.getAttribute('data-id');
      state.settings.classes = state.settings.classes.filter(function(c){ return c.id!==id; });
      delete state.plans[id];
      Promise.all([saveSettings(), savePlans()]).then(function(){ renderOnboarding(true); });
    };
  });
  var gotoSchedule = ov.querySelector('#obGotoSchedule');
  if(gotoSchedule) gotoSchedule.onclick = function(){
    finishOnboarding();
    switchView('settings');
    state.settingsTab = 'schedule';
    state.scheduleSubTab = 'myTimetable';
    renderSettings();
  };
  var gotoPlans = ov.querySelector('#obGotoPlans');
  if(gotoPlans) gotoPlans.onclick = function(){
    finishOnboarding();
    switchView('settings');
    state.settingsTab = 'plans';
    renderSettings();
  };
}

// ---------- 주간 진도 리포트 ----------
// 월요일에 앱을 열면 지난주(지난 월~일) 요약을 자동으로 팝업으로 보여준다. 하루에 한 번만.
// '반별 현황' 탭에서도 언제든 같은 팝업을 다시 볼 수 있다.
function getLastWeekRange(dateStr){
  var d = parseDate(dateStr);
  var dow = d.getDay(); // 0=일,1=월...
  var diffToMonday = (dow===0) ? 6 : dow-1;
  var thisMonday = addDays(dateStr, -diffToMonday);
  var lastMonday = addDays(thisMonday, -7);
  var lastSunday = addDays(thisMonday, -1);
  return { start:lastMonday, end:lastSunday };
}
function weeklyReportData(startStr, endStr){
  return state.settings.classes.map(function(c){
    var items = state.plans[c.id] || [];
    var doneItems = items.filter(function(it){ return it.doneDate && it.doneDate>=startStr && it.doneDate<=endStr; });
    var sessionCount = 0;
    var d = startStr, guard = 0;
    while(d <= endStr && guard < 14){
      getRecords(d).forEach(function(r){ if(r.classId===c.id && (r.saved || r.excused)) sessionCount++; });
      d = addDays(d, 1);
      guard++;
    }
    return { cls:c, doneCount: doneItems.length, sessionCount: sessionCount };
  });
}
function showWeeklyReportModal(markShown){
  var range = getLastWeekRange(todayStr());
  Promise.all([ ensureMonth(ymOf(range.start)), ensureMonth(ymOf(range.end)) ]).then(function(){
    var data = weeklyReportData(range.start, range.end);
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    var rows = data.map(function(d){
      return '<div class="report-row"><span class="class-chip" style="background:'+d.cls.color+'">'+escapeHtml(d.cls.name)+'</span>'+
        '<span class="report-stat">'+(d.doneCount>0 ? ('완료 항목 '+d.doneCount+'개') : '완료된 항목 없음')+'<br>수업 기록 '+d.sessionCount+'회</span></div>';
    }).join('');
    overlay.innerHTML = '<div class="modal-box">'+
      '<h3>지난주 진도 요약</h3>'+
      '<p class="small-note" style="margin:-8px 0 14px;">'+niceDate(range.start)+' ~ '+niceDate(range.end)+'</p>'+
      (data.length ? rows : '<p class="small-note">등록된 반이 없어요.</p>')+
      '<div class="modal-actions"><button class="btn" id="reportCloseBtn" style="width:100%;">확인했어요</button></div>'+
    '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
    overlay.querySelector('#reportCloseBtn').addEventListener('click', function(){ overlay.remove(); });
    if(markShown){
      state.settings.lastWeeklyReportShown = todayStr();
      saveSettings();
    }
  });
}
function maybeShowWeeklyReport(){
  if(!state.settings.onboardingDone) return; // 아직 온보딩 중인 신규 사용자는 건너뜀
  if(state.settings.classes.length===0) return;
  if(dayKorOf(todayStr()) !== '월') return;
  if(state.settings.lastWeeklyReportShown === todayStr()) return;
  showWeeklyReportModal(true);
}

function init(){
  Promise.all([
    loadJSON('settings', null),
    loadJSON('plans', {})
  ]).then(function(res){
    state.settings = res[0] || defaultSettings();
    if(!state.settings.holidays) state.settings.holidays = [];
    if(!state.settings.exams) state.settings.exams = [];
    if(!state.settings.semesters) state.settings.semesters = [];
    if(state.settings.autoHolidaysEnabled === undefined) state.settings.autoHolidaysEnabled = true;
    if(!state.settings.holidayExceptions) state.settings.holidayExceptions = [];
    if(state.settings.autoSuneungEnabled === undefined) state.settings.autoSuneungEnabled = true;
    if(!state.settings.customDdays) state.settings.customDdays = [];
    if(!state.settings.neisHolidays) state.settings.neisHolidays = [];
    state.settings.neisHolidays.forEach(function(h){ if(!h.classified) h.classified = 'event'; });
    if(state.settings.neisOfcdc === undefined) state.settings.neisOfcdc = '';
    if(state.settings.neisSchul === undefined) state.settings.neisSchul = '';
    if(state.settings.neisSchoolName === undefined) state.settings.neisSchoolName = '';
    if(!state.settings.fontScale) state.settings.fontScale = 1;
    if(!state.settings.schoolLevel) state.settings.schoolLevel = 'high';
    if(!state.settings.classDuration) state.settings.classDuration = 50;
    if(state.settings.breakDuration===undefined) state.settings.breakDuration = 10;
    if(!state.settings.firstPeriodStart) state.settings.firstPeriodStart = '09:00';
    if(state.settings.lunchAfterPeriod===undefined) state.settings.lunchAfterPeriod = 4;
    if(!state.settings.lunchDuration) state.settings.lunchDuration = 50;
    if(state.settings.onboardingDone === undefined){
      // 이 업데이트 이전부터 이미 반을 등록해서 쓰던 사용자는 온보딩을 볼 필요 없음
      state.settings.onboardingDone = state.settings.classes.length > 0;
    }
    if(!state.settings.themeMode) state.settings.themeMode = 'system';
    if(!state.settings.dayOverrides) state.settings.dayOverrides = {};
    if(!state.settings.makeupClasses) state.settings.makeupClasses = [];
    // 반 색상 팔레트를 바꿨을 때 예전에 만든 반들도 새 팔레트로 다시 입혀준다 (등록 순서 기준)
    state.settings.classes.forEach(function(c, i){ c.color = CLASS_COLORS[i % CLASS_COLORS.length]; });
    applyFontScale();
    applyTheme();
    state.settings.exams = state.settings.exams.map(function(e){
      if(!e.type || !e.startDate){
        e = { id:e.id||uid(), type:'writtenExam', name:e.name, startDate:e.date||e.startDate, endDate:e.date||e.endDate||e.startDate };
      }
      if(!e.classIds){
        if(e.grades && e.grades.length){
          e.classIds = state.settings.classes.filter(function(c){ return c.grade && e.grades.indexOf(c.grade)!==-1; }).map(function(c){ return c.id; });
        } else {
          e.classIds = [];
        }
      }
      return e;
    });
    state.plans = res[1] || {};
    Object.keys(state.plans).forEach(function(cid){
      (state.plans[cid]||[]).forEach(function(it){
        if(!it.status) it.status = it.done ? 'done' : 'pending';
      });
    });
    return ensureMonth(ymOf(state.currentDate));
  }).then(function(){
    renderAll();
    renderOnboarding();
    maybeShowWeeklyReport();
    hideSplash();
  }).catch(function(e){
    console.error(e);
    state.settings = defaultSettings();
    state.plans = {};
    applyFontScale();
    applyTheme();
    renderAll();
    renderOnboarding();
    hideSplash();
  });
}
init();

})();
</script>
