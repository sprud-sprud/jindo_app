<style>
  :root{
    --bg:#FAFAF9;
    --bg-soft:#EFEFED;
    --card:#FFFFFF;
    --ink:#22252A;
    --ink-soft:#75726C;
    --ink-faint:#C9C6BF;
    --line:#E3E3E1;
    --sage:#7E9A74;
    --sage-deep:#48603F;
    --sage-bg:#E6EDE2;
    --coral:#E06D53;
    --coral-deep:#B84F39;
    --coral-bg:#FBE7E1;
    --lav:#8D82A8;
    --lav-deep:#54486F;
    --lav-bg:#E7E3EF;
    --butter:#B5924A;
    --butter-deep:#71581F;
    --butter-bg:#EFE7D3;
    --rose:#AD6D68;
    --rose-deep:#733B36;
    --stamp:#7E9A74;
    --holiday-bg:#FCE8E6;
    --gray-100:#EBEBEB;
    --gray-400:#808080;
    --gray-700:#464646;
    --shadow: 0 2px 14px rgba(34,37,42,0.07);
    --shadow-soft: 0 1px 3px rgba(34,37,42,0.05);
    --radius: 16px;
  }
  :root[data-theme="dark"]{
    --bg:#17171C;
    --bg-soft:#232329;
    --card:#202028;
    --ink:#F2F1EF;
    --ink-soft:#B8B6C0;
    --ink-faint:#5C5A66;
    --line:#2E2E36;
    --sage:#7E9A74;
    --sage-deep:#9BC78F;
    --sage-bg:#1E2B22;
    --coral:#E0836D;
    --coral-deep:#D2604A;
    --coral-bg:#3A2A26;
    --rose-deep:#D89A94;
    --stamp:#9BC78F;
    --holiday-bg:#3A2420;
    --gray-100:#2B2B31;
    --gray-400:#6E6E78;
    --gray-700:#D8D6DC;
    --shadow: 0 2px 14px rgba(0,0,0,0.4);
    --shadow-soft: 0 1px 3px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{ font-family:'Pretendard', sans-serif; font-weight:700; letter-spacing:-0.3px; }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-top:env(safe-area-inset-top);
    background:var(--bg);
  }
  .save-badge{
    position:fixed;
    top:calc(env(safe-area-inset-top) + 14px);
    right:16px;
    font-size:0.75rem;
    color:var(--coral-deep);
    background:var(--coral-bg);
    padding:6px 12px;
    border-radius:20px;
    box-shadow:var(--shadow-soft);
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
    z-index:500;
  }
  .save-badge.show{opacity:1;transform:translateY(0);}
  main{
    flex:1;
    padding:18px 16px 96px;
    overflow-x:hidden;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big-emoji{font-size:2.125rem;margin-bottom:10px;}
  .empty-state h2{color:var(--ink);font-size:1.375rem;margin:6px 0 6px;}
  .empty-state p{font-size:0.875rem;line-height:1.6;margin:0 0 18px;}
  button.btn{
    font-family:'Pretendard',sans-serif;
    font-weight:600;
    font-size:0.8438rem;
    border:none;
    border-radius:11px;
    padding:11px 16px;
    cursor:pointer;
    background:var(--coral-deep);
    color:#fff;
    transition:opacity .12s ease, transform .1s ease;
  }
  button.btn:active{opacity:.85;transform:scale(.97);}
  button.btn.ghost{
    background:var(--card);
    color:var(--coral-deep);
    border:1px solid var(--coral);
  }
  button.btn.coral{background:var(--coral-deep);}
  button.btn.small{padding:7px 12px;font-size:0.7812rem;border-radius:9px;}
  button.icon-btn{
    background:none;border:none;cursor:pointer;
    font-size:0.9375rem;color:var(--ink-soft);
    padding:6px 10px;border-radius:7px;
    font-family:inherit;
    transition:background .12s ease, transform .1s ease;
  }
  button.icon-btn:active{background:var(--bg-soft);transform:scale(.94);}

  .status-btn, .tab-pill, .card-folded, .excuse-btn, .nav-btn, .class-chip, .check, .now-focus-badge, .stamp, .settings-menu-row, .week-cell{
    transition:transform .1s ease, opacity .1s ease, background .12s ease, border-color .12s ease;
  }
  .status-btn:active, .tab-pill:active, .card-folded:active, .excuse-btn:active, .nav-btn:active, .check:active, .settings-menu-row:active, .week-cell:active{
    transform:scale(.96);
  }

  .week-header{margin:6px 0 16px;}
  .week-header-top{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  }
  .week-title{font-size:1.3125rem;font-weight:800;color:var(--ink);}
  .week-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .week-cell{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 2px 8px;border-radius:12px;cursor:pointer;position:relative;
    background:var(--card);box-shadow:var(--shadow-soft);
  }
  .week-cell .wc-dow{font-size:0.6875rem;color:var(--ink-faint);font-weight:600;}
  .week-cell .wc-num{font-size:1.0625rem;font-weight:700;color:var(--ink);}

}
function periodTagLabel(period){
  var pt = computePeriodTime(period-1);
  return period+'교시 · '+pt.start+'~'+pt.end;
}

// 오늘 시간표 중 '지금 진행 중'이거나 '바로 다음에 들어갈' 교시를 찾는다. (오늘 볼 때만 의미가 있음)
function findFocusPeriod(sched){
  if(!sched || !sched.length) return null;
  var now = new Date();
  var nowMins = now.getHours()*60 + now.getMinutes();
  var inProgress = null, next = null, nextStart = Infinity;
  sched.forEach(function(s){
    var pt = computePeriodTime(s.period-1);
    var startMins = timeToMinutes(pt.start), endMins = timeToMinutes(pt.end);
    if(nowMins >= startMins && nowMins < endMins){ inProgress = s; }
    else if(startMins > nowMins && startMins < nextStart){ next = s; nextStart = startMins; }
  });
  return inProgress || next || null;
}

// 진도 입력이 끝난(완료/개인사정) 카드는 하단에 접어서 보여준다. 눌러서 펼치면 renderDayCard로 대체된다.
function renderFoldedCard(dateStr, period, classId){
  var cls = getClass(classId);
  if(!cls) return '';

  var summary;
  if(rec.excused){

  } else {
    var items = state.plans[classId] || [];
    var mainItemId = recMainItemId(rec);
    var idx = items.findIndex(function(i){ return i.id===mainItemId; });
    var it = idx!==-1 ? items[idx] : null;
    summary = it ? ((idx+1)+'. '+it.title+(rec.pageText?(' · '+rec.pageText):'')) : '진도 기록 완료';
  }

    '<span class="period-tag-mini">'+period+'교시</span>'+
    '<span class="class-chip" style="background:'+cls.color+';font-size:0.6875rem;padding:2px 7px;">'+escapeHtml(cls.name)+'</span>'+
    '<span class="folded-progress">'+escapeHtml(summary)+'</span>'+
    statusIconSvg(status,14)+

}
var FONT_SCALE_STEPS = [0.85, 0.9, 0.95, 1, 1.05, 1.1, 1.15, 1.2, 1.3];

// 라이트/다크 테마 적용. '시스템' 모드면 기기 설정을 따라간다.
function applyTheme(){
  var mode = (state.settings && state.settings.themeMode) || 'system';
  var isDark = mode==='dark' || (mode==='system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', isDark ? '#2A1A15' : '#B84F39');
}

  var __mq = window.matchMedia('(prefers-color-scheme: dark)');
  var __onSchemeChange = function(){ if(!state.settings || (state.settings.themeMode||'system')==='system') applyTheme(); };
  if(__mq.addEventListener) __mq.addEventListener('change', __onSchemeChange);
  else if(__mq.addListener) __mq.addListener(__onSchemeChange);
}
function closestScaleIndex(scale){
  var best = 0, bestDiff = Infinity;
  FONT_SCALE_STEPS.forEach(function(s,i){
    var diff = Math.abs(s-scale);
    if(diff < bestDiff){ bestDiff = diff; best = i; }
  });
  return best;
}
function suneungDate(year){

var STORE_PREFIX = 'jindosucheop:';
function loadJSON(key, fallback){
  try{
    var v = localStorage.getItem(STORE_PREFIX+key);
    if(v==null) return Promise.resolve(fallback);
    return Promise.resolve(JSON.parse(v));
  }catch(e){
    console.error('불러오기 실패', key, e);
    return Promise.resolve(fallback);
  }
}
function saveJSON(key, obj){

    localStorage.setItem(STORE_PREFIX+key, JSON.stringify(obj));

  }catch(e){

}
function listStoredKeys(prefix){

function getClass(id){ return state.settings.classes.find(function(c){ return c.id===id; }); }
// 특정 날짜에 다른 요일 시간표를 적용해뒀으면(일회성 교체) 그 요일 기준으로 시간표를 읽는다.
function effectiveDayKor(dateStr){
  var override = state.settings.dayOverrides && state.settings.dayOverrides[dateStr];
  return override || dayKorOf(dateStr);
}
function scheduleFor(dateStr){
  var dk = effectiveDayKor(dateStr);
  var out = [];
  if(DAYS.indexOf(dk) !== -1){
    var arr = state.settings.schedule[dk] || [];
    arr.forEach(function(classId, i){
      if(classId) out.push({ period:i+1, classId:classId });
    });
  }
  // 실보강으로 이 날짜/교시에 따로 잡아둔 보강 수업도 그날 시간표에 합쳐서 보여준다.
  (state.settings.makeupClasses||[]).forEach(function(mc){
    if(mc.date===dateStr) out.push({ period:mc.period, classId:mc.classId, isMakeup:true, makeupId:mc.id });
  });
  out.sort(function(a,b){ return a.period-b.period; });

}

// 교시 기록은 "메인 진도 항목" 하나(itemId)와, 그 날 추가로 더 나간 진도가 있으면
// 각자 자기 상태를 가지는 "추가 진도" 목록(extraItems)을 따로 관리한다.
// 예전 버전 기록(itemId 하나만 있던 것, 혹은 한때 썼던 itemIds 다중선택)도 함께 지원한다.
function recMainItemId(rec){
  if(!rec) return '';
  if(rec.itemId) return rec.itemId;
  if(rec.itemIds && rec.itemIds.length) return rec.itemIds[0];
  return '';
}
function recExtraItems(rec){
  if(!rec) return [];
  if(rec.extraItems) return rec.extraItems;
  if(rec.itemIds && rec.itemIds.length>1){
    return rec.itemIds.slice(1).map(function(id){ return { itemId:id, status: rec.status||'done' }; });
  }
  return [];
}
function recItemIds(rec){
  var out = [];
  var main = recMainItemId(rec);
  if(main) out.push(main);
  recExtraItems(rec).forEach(function(e){ if(e.itemId) out.push(e.itemId); });
  return out;
}

function classStats(classId){
  var items = state.plans[classId] || [];
  var total = items.length;
  var done = items.filter(function(i){ return i.done; }).length;
  var touchedItems = items.filter(function(i){ return i.doneDate; });
  touchedItems.sort(function(a,b){ return a.doneDate < b.doneDate ? 1 : -1; });
  var last = touchedItems[0] || null;
  var next = items.find(function(i){ return !i.done; }) || null;
  return { total:total, done:done, ratio: total? done/total : 0, last:last, next:next };
}

// 시험(주로 지필평가)마다 "이 시험까지 몇 번째 진도 항목까지 나가야 하는지"를 하나의 순번으로 지정해두면
// 전체 진도계획이 아니라 그 범위만 기준으로 남은 진도를 계산한다. 반마다 세부 내용은 달라도 진도 순서는
// 보통 같이 가기 때문에, 반별로 따로 지정하지 않고 시험 하나에 순번 하나만 지정한다.
// exam.examTargetOrder = 몇 번째 항목까지 (1부터 시작). 지정이 없으면 기존처럼 전체 진도계획 기준.
// (예전 버전에서 쓰던 반별 exam.examTargets 필드가 있으면 호환을 위해 함께 확인한다.)
function referencePlanItems(){
  // 진도 목표 선택지에 쓸 기준 반 — 진도 항목이 가장 많이 등록된 반을 기준으로 번호를 매긴다.
  var best = null, bestLen = -1;
  state.settings.classes.forEach(function(c){
    var items = state.plans[c.id] || [];
    if(items.length > bestLen){ best = c; bestLen = items.length; }
  });
  return best ? (state.plans[best.id] || []) : [];
}
// startOrder: 이 시험 바로 이전 지필평가의 목표 순번(있으면). 그 다음 항목부터 이 시험의 목표까지가
// 이 시험의 진도 범위가 된다. (예: 중간고사 목표 5번 → 1~5번, 기말고사 목표 10번 → 6~10번)
function examTargetStats(classId, exam, startOrder){
  var items = state.plans[classId] || [];
  var endIdx = items.length - 1;
  var legacyTargetId = exam && exam.examTargets && exam.examTargets[classId];
  if(exam && exam.examTargetOrder){
    endIdx = Math.min(exam.examTargetOrder, items.length) - 1;
  } else if(legacyTargetId){
    var idx = items.findIndex(function(i){ return i.id===legacyTargetId; });
    if(idx !== -1) endIdx = idx;
  }
  var startIdx = startOrder ? Math.min(startOrder, items.length) : 0;
  if(startIdx > endIdx + 1) startIdx = endIdx + 1;
  var slice = items.slice(Math.max(startIdx,0), Math.max(endIdx+1,0));
  var total = slice.length;
  var done = slice.filter(function(i){ return i.done; }).length;
  var rangeLabel = items.length ? ((Math.max(startIdx,0)+1)+'~'+Math.max(endIdx+1,startIdx)+'번') : '';
  return { total: total, done: done, remain: total - done, hasCustomTarget: !!((exam && exam.examTargetOrder) || legacyTargetId), rangeLabel: rangeLabel };
}

function findBlockingExam(dateStr, classId, period){
  var cls = getClass(classId);
  var grade = cls ? (cls.grade||'') : '';
  return state.settings.exams.find(function(e){
    if(e.type==='performance' && e.slots && e.slots.length){
      return e.slots.some(function(s){
        if(s.classId !== classId || s.date !== dateStr) return false;
        if(s.period != null){
          if(period == null) return true; // period unknown at call site: err toward blocking
          return s.period === period;
        }
        return true;
      });
    }
    if(dateStr < e.startDate || dateStr > e.endDate) return false;
    if(e.type==='event'){
      if(!e.grades || !e.grades.length) return true;
      return grade && e.grades.indexOf(grade) !== -1;
    }
    if(!e.classIds || !e.classIds.length) return true;
    if(e.classIds.indexOf(classId) === -1) return false;
    if(e.periodsByClass && e.periodsByClass[classId] != null){
      if(period == null) return true; // period unknown at call site: err toward blocking so it isn't missed
      return e.periodsByClass[classId] === period;
    }
    return true;
  }) || null;
}
function examBlocksDate(dateStr, classId, period){
  return !!findBlockingExam(dateStr, classId, period);
}
function countSessions(classId, fromExclusive, toInclusive){
  if(fromExclusive >= toInclusive) return 0;
  var count = 0;
  var d = addDays(fromExclusive, 1);
  var guard = 0;
  while(d <= toInclusive && guard < 3660){
    guard++;
    if(!isHolidayEffective(d) && inAnySemester(d)){
      var recs = getRecords(d);
      // scheduleFor()가 요일 교체(dayOverrides)와 보강 수업(makeupClasses)을 이미 반영해서 돌려준다
      scheduleFor(d).forEach(function(s){
        if(s.classId!==classId) return;
        var period = s.period;
        if(examBlocksDate(d, classId, period)) return;
        var rec = recs.find(function(r){ return r.period===period; });
        if(rec && rec.excused) return;
        count++;
      });
    }
    d = addDays(d, 1);
  }
  return count;
}

function applyPlanImportRows(rows){
  if(!rows || !rows.length){ alert('불러올 데이터가 없어요.'); return; }
  var nameToId = {};
  state.settings.classes.forEach(function(c){ nameToId[c.name] = c.id; });
  var addedCount = 0, newClassNames = [];
  rows.forEach(function(row){
    var subject = String(row['과목']||'').trim();
    var content = String(row['수업내용']||'').trim();
    if(!subject || !content) return;
    var doneVal = String(row['완료여부']||'').trim();
    var isDone = /^(완료|y|yes|true|1|o)$/i.test(doneVal);
    var classId = nameToId[subject];
    if(!classId){
      classId = uid();
      var color = CLASS_COLORS[state.settings.classes.length % CLASS_COLORS.length];
      state.settings.classes.push({ id:classId, name:subject, color:color, grade:'' });
      state.plans[classId] = [];
      nameToId[subject] = classId;
      newClassNames.push(subject);
    }
    var item = { id:uid(), title:content, targetPage:'', done:isDone, status:isDone?'done':'pending', doneDate:isDone?todayStr():null, donePage:'' };
    if(!state.plans[classId]) state.plans[classId] = [];
    state.plans[classId].push(item);
    addedCount++;
  });
  if(!addedCount){ alert('가져올 수 있는 행이 없었어요. "과목"과 "수업내용" 칸이 채워져 있는지 확인해주세요.'); return; }
  Promise.all([saveSettings(), savePlans()]).then(function(){
    flashSaved();
    var body = document.getElementById('settingsBody');
    if(body) renderSettingsData(body);
    alert('진도 '+addedCount+'개를 불러왔어요.'+(newClassNames.length?(' 새로 만든 반: '+newClassNames.join(', ')):''));
  });
}

function exportExcel(btn){

            var items = state.plans[r.classId] || [];
            itemTitle = recIds.map(function(id){
              var it = items.find(function(x){ return x.id===id; });
              return it ? it.title : '';
            }).filter(Boolean).join(', ');
          }
          var st = r.status || (r.progressDone && r.problemDone ? 'done' : r.progressDone ? 'inProgress' : r.problemDone ? 'practicing' : 'pending');
          rows.push({
            '날짜': dateStr,
            '요일': dayKorOf(dateStr),
            '교시': r.period,
            '반': cls ? cls.name : '',
            '진도항목': itemTitle,
            '쪽수': r.pageText || '',
            '상태': STATUS_META[st] ? STATUS_META[st].label : st,
            '발표자': r.presenter || '',
            '메모': r.memo || ''
          });
        });
      });
    });
    rows.sort(function(a,b){
      if(a['날짜'] !== b['날짜']) return a['날짜'] < b['날짜'] ? -1 : 1;
      return a['교시'] - b['교시'];
    });

    var planRows = [];
    state.settings.classes.forEach(function(c){
      (state.plans[c.id] || []).forEach(function(it, idx){
        planRows.push({
          '반': c.name,
          '순서': idx+1,
          '항목': it.title,
          '목표쪽수': it.targetPage || '',
          '완료여부': it.done ? 'O' : 'X',
          '완료날짜': it.doneDate || '',
          '완료쪽수': it.donePage || ''
        });
      });
    });

    var schedRows = [];
    for(var p=0; p<state.settings.periodsPerDay; p++){
      var row = { '교시': p+1 };
      DAYS.forEach(function(d){
        var cid = state.settings.schedule[d][p];
        var c = cid ? getClass(cid) : null;
        row[d] = c ? c.name : '';
      });
      schedRows.push(row);
    }

    var examRows = state.settings.exams.map(function(e){
      return { '종류': EXAM_TYPES[e.type] || e.type, '이름': e.name, '시작일': e.startDate, '종료일': e.endDate };
    });
    var holidayRows = state.settings.holidays.map(function(h){
      return { '날짜': h, '요일': dayKorOf(h), '종류': '직접 등록' };
    });
    LEGAL_HOLIDAYS.forEach(function(h){
      if(isAutoHolidayActive(h.date)) holidayRows.push({ '날짜': h.date, '요일': dayKorOf(h.date), '종류': h.name+' (자동)' });
    });
    holidayRows.sort(function(a,b){ return a['날짜']<b['날짜']?-1:1; });
    var semesterRows = state.settings.semesters.map(function(s){
      return { '학기': s.name, '시작일': s.start, '종료일': s.end };
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'날짜':'','요일':'','교시':'','반':'','진도항목':'','쪽수':'','상태':'','발표자':'','메모':''}]), '일별기록');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows.length?planRows:[{'반':'','순서':'','항목':'','목표쪽수':'','완료여부':'','완료날짜':'','완료쪽수':''}]), '진도계획');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(schedRows), '시간표');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(examRows.length?examRows:[{'종류':'','이름':'','시작일':'','종료일':''}]), '시험일정');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(semesterRows.length?semesterRows:[{'학기':'','시작일':'','종료일':''}]), '학기');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(holidayRows.length?holidayRows:[{'날짜':'','요일':'','종류':''}]), '휴업일');

    XLSX.writeFile(wb, '진도수첩_'+todayStr()+'.xlsx');
    btn.textContent = origText;
    btn.disabled = false;
  }).catch(function(e){
    console.error('내보내기 실패', e);
    alert('엑셀 내보내기에 실패했어요. 다시 시도해주세요.');
    btn.textContent = origText;
    btn.disabled = false;
  });
}

function buildBackupObject(){
  return listStoredKeys('records:').then(function(keys){
    return Promise.all(keys.map(function(k){
      return loadJSON(k, {}).then(function(v){ return [k, v]; });
    }));
  }).then(function(pairs){
    var records = {};
    pairs.forEach(function(p){ records[p[0].replace('records:','')] = p[1]; });
    return { app:'jindosucheop', version:1, exportedAt: todayStr(), settings: state.settings, plans: state.plans, records: records };
  });
}

function restoreBackupObject(data){
  if(!data || !data.settings) return Promise.reject(new Error('올바른 백업 데이터가 아니에요.'));
  state.settings = data.settings;
  state.plans = data.plans || {};
  state.monthCache = {};
  var writes = [saveSettings(), savePlans()];
  Object.keys(data.records || {}).forEach(function(ym){
    state.monthCache[ym] = data.records[ym];
    writes.push(saveJSON('records:'+ym, data.records[ym]));
  });
  return Promise.all(writes).then(function(){
    state.currentDate = todayStr();
    renderAll();
    flashSaved();
  });
}

function exportJSONBackup(btn){
  var origText = btn.textContent;
  btn.textContent = '내보내는 중...';
  btn.disabled = true;
  buildBackupObject().then(function(backup){
    var blob = new Blob([JSON.stringify(backup)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = '진도수첩_백업_'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent = origText;
    btn.disabled = false;
  }).catch(function(e){
    console.error('백업 내보내기 실패', e);
    alert('백업 내보내기에 실패했어요.');
    btn.textContent = origText;
    btn.disabled = false;
  });
}

function importJSONBackup(file){
  if(!confirm('백업 파일을 불러오면 지금 기기에 있는 데이터를 덮어써요. 계속할까요?')) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = JSON.parse(e.target.result);
      restoreBackupObject(data).catch(function(err){
        console.error(err);
        alert('올바른 백업 파일이 아니에요.');
      });
    }catch(err){
      console.error('백업 불러오기 실패', err);
      alert('파일을 읽는 데 실패했어요. 올바른 백업 파일인지 확인해주세요.');
    }
  };
  reader.readAsText(file);
}

function ymd8(dateStr){ return dateStr.replace(/-/g,''); }
function fromYmd8(s){ return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); }

function generateTransferCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

function exportViaCode(btn, resultEl){
  var rtdbUrl = RTDB_URL;
  var origText = btn.textContent;
  btn.textContent = '올리는 중...';
  btn.disabled = true;
  resultEl.innerHTML = '';
  buildBackupObject().then(function(backup){
    var code = generateTransferCode();
    var jsonStr = JSON.stringify(backup);
    return fetch(rtdbUrl+'/transfers/'+code+'.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ data: jsonStr, createdAt: Date.now() })
    }).then(function(r){
      if(!r.ok) throw new Error('업로드 실패 ('+r.status+')');
      return code;
    });
  }).then(function(code){
    resultEl.innerHTML = '<div class="transfer-code-box">'+
      '<div class="tc-label">이 번호를 새 기기에 입력하세요</div>'+
      '<div class="tc-code">'+code+'</div>'+
      '<div class="tc-note">30분 정도만 유효해요. 다른 사람에게 알려주지 마세요.</div></div>';
    btn.textContent = origText;
    btn.disabled = false;
  }).catch(function(err){
    console.error('코드 내보내기 실패', err);
    resultEl.innerHTML = '<p class="small-note">업로드에 실패했어요. Firebase 주소와 규칙 설정을 확인해주세요. ('+escapeHtml(err.message||'')+')</p>';
    btn.textContent = origText;
    btn.disabled = false;
  });
}

function importViaCode(btn, code, resultEl){
  var rtdbUrl = RTDB_URL;
  code = (code||'').trim();
  if(!/^[0-9]{6}$/.test(code)){
    resultEl.innerHTML = '<p class="small-note">6자리 숫자 코드를 입력해주세요.</p>';
    return;
  }
  if(!confirm('코드로 데이터를 불러오면 지금 기기에 있는 데이터를 덮어써요. 계속할까요?')) return;
  var origText = btn.textContent;
  btn.textContent = '가져오는 중...';
  btn.disabled = true;
  var path = rtdbUrl+'/transfers/'+code+'.json';
  fetch(path).then(function(r){ return r.json(); }).then(function(entry){
    if(!entry || !entry.data) throw new Error('해당 코드를 찾을 수 없어요. 코드나 유효시간을 확인해주세요.');
    var ageMs = Date.now() - (entry.createdAt||0);
    if(ageMs > 30*60*1000){
      fetch(path, { method:'DELETE' });
      throw new Error('코드가 만료됐어요(30분 경과). 다시 내보내기 해주세요.');
    }
    var backup = JSON.parse(entry.data);
    return restoreBackupObject(backup).then(function(){
      return fetch(path, { method:'DELETE' });
    });
  }).then(function(){
    resultEl.innerHTML = '<p class="small-note">불러오기 완료! 이 코드는 이제 사용할 수 없어요.</p>';
    btn.textContent = origText;
    btn.disabled = false;
  }).catch(function(err){
    console.error('코드 가져오기 실패', err);
    resultEl.innerHTML = '<p class="small-note">'+escapeHtml(err.message||'불러오기에 실패했어요.')+'</p>';
    btn.textContent = origText;
    btn.disabled = false;
  });
}

function fetchNeisSchedule(key, ofcdc, schul, statusEl, body){
  if(!key || !ofcdc || !schul){
    statusEl.textContent = '인증키를 입력하고, 학교를 먼저 검색해서 선택해주세요.';
    return;
  }
  statusEl.textContent = '불러오는 중...';
  var from = todayStr();
  var to = addDays(from, 365);
  var url = 'https://open.neis.go.kr/hub/SchoolSchedule?KEY='+encodeURIComponent(key)+
    '&Type=json&pIndex=1&pSize=1000&ATPT_OFCDC_SC_CODE='+encodeURIComponent(ofcdc)+
    '&SD_SCHUL_CODE='+encodeURIComponent(schul)+
    '&AA_FROM_YMD='+ymd8(from)+'&AA_TO_YMD='+ymd8(to);
  fetch(url).then(function(r){ return r.json(); }).then(function(data){
    if(data.RESULT){
      statusEl.textContent = '불러오기 실패: '+(data.RESULT.MESSAGE||'알 수 없는 오류');
      return;
    }
    var rows = (data.SchoolSchedule && data.SchoolSchedule[1] && data.SchoolSchedule[1].row) || [];
    var imported = rows.filter(function(r){ return r.EVENT_NM && r.EVENT_NM.trim(); })
      .map(function(r){
        var grades = [];
        if(r.ONE_GRADE_EVENT_YN==='Y') grades.push('1학년');
        if(r.TW_GRADE_EVENT_YN==='Y') grades.push('2학년');
        if(r.THREE_GRADE_EVENT_YN==='Y') grades.push('3학년');
        return { date: fromYmd8(r.AA_YMD), name: r.EVENT_NM, sbtr: r.SBTR_DD_SC_NM||'', grades: grades, classified:'event' };
      });
    state.settings.neisHolidays = imported;
    saveSettings().then(function(){
      statusEl.textContent = imported.length+'개 일정을 불러왔어요.';
      renderSettingsSemesterHoliday(body);
      flashSaved();
    });
  }).catch(function(err){
    console.error('NEIS 조회 실패', err);
    statusEl.textContent = '불러오기에 실패했어요. 키/코드를 확인하시거나, 잠시 후 다시 시도해주세요.';
  });
}

function renderToday(){
  var el = document.getElementById('view-today');
  var d = state.currentDate;
  var dk = dayKorOf(d);
  var isToday = d === todayStr();
  var status = dayStatus(d);
  var sched = status==='school' ? scheduleFor(d) : [];
  var autoH = findAutoHoliday(d);
  var weekdayLabel = dk+'요일'+(status==='holiday'?(' · '+(autoH&&isAutoHolidayActive(d)?autoH.name:'휴업일')):(status==='vacation'?' · 방학':''));

  var html = '';
  if(!isToday) html += '<button class="today-bar-btn" id="jumpTodayTop">오늘로 돌아가기</button>';
  html += '<div class="week-header">';
  html += '<div class="week-header-top"><div class="week-title">'+niceDate(d)+' '+weekdayLabel+'</div>'+
    '<button class="icon-btn" id="openMonthSheetBtn"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 9.5h16"></path><path d="M8 3v3.5M16 3v3.5"></path></svg></button></div>';
  html += buildWeekStripHtml(d);
  html += '</div>';

  if(state.settings.classes.length === 0){
    html += emptyStateHtml('🏫','아직 반이 없어요','설정에서 반과 시간표를 먼저 만들어주세요.','settings');
  } else {
    if(status==='vacation'){
      html += '<div class="empty-state"><h2>방학 기간이에요</h2><p>설정 &gt; 학사일정에서 학기 기간을 확인해보세요.</p></div>';
    } else if(status==='holiday'){
      html += '<div class="empty-state"><h2>'+(autoH?autoH.name:'휴업일')+'이에요</h2><p>이 날은 수업이 없는 날로 등록되어 있어요.</p></div>';
    } else if(sched.length === 0){
      html += '<div class="empty-state"><h2>수업이 없는 날</h2><p>이 날엔 시간표에 등록된 수업이 없어요.</p></div>';
    } else {
      var focus = isToday ? findFocusPeriod(sched) : null;
      var activeEntries = [], completedPeriods = [], focusEntry = null;
      sched.forEach(function(s){
        var blockingExam = findBlockingExam(d, s.classId, s.period);
        var isFoc = !!(focus && focus.period===s.period && focus.classId===s.classId);
        if(blockingExam){
          var entry = { s:s, blockingExam:blockingExam, isFoc:isFoc };
          if(isFoc) focusEntry = entry; else activeEntries.push(entry);
          return;
        }
        var rec = getRecords(d).find(function(r){ return r.period===s.period; });
        var isDone = !!(rec && (rec.excused || rec.saved || rec.itemId || (rec.extraItems && rec.extraItems.length)));
        var key = d+'-'+s.period;
        // 저장된(완료 처리된) 수업은 지금 이 시간이어도 접어서 내려보낸다.
        // '지금 이 시간' 핀은 아직 저장 안 한, 채워야 할 카드를 상단에 띄워주기 위한 용도이기 때문.
        if(isDone && !state.uiExpanded[key]){
          completedPeriods.push(s);
        } else if(isFoc){
          focusEntry = { s:s, isFoc:true };
        } else {
          activeEntries.push({ s:s, isFoc:false });
        }
      });
      var orderedActive = focusEntry ? [focusEntry].concat(activeEntries) : activeEntries;
      orderedActive.forEach(function(e){
        html += e.blockingExam ? renderExamBlockedCard(e.s.period, e.s.classId, e.blockingExam) : renderDayCard(d, e.s.period, e.s.classId, e.isFoc, e.s.isMakeup);
      });
      if(completedPeriods.length){
        html += '<div class="completed-zone-label">저장된 수업</div>';
        completedPeriods.forEach(function(s){
          html += renderFoldedCard(d, s.period, s.classId);
        });
      }
    }
    html += renderExtrasSection(d);
  }
  el.innerHTML = html;

  var jt = document.getElementById('jumpTodayTop');
  if(jt) jt.onclick = function(){ state.currentDate = todayStr(); goToDate(state.currentDate); };
  el.querySelectorAll('.week-cell[data-date]').forEach(function(cell){
    cell.addEventListener('click', function(){ animateDayJump(cell.getAttribute('data-date')); });
  });
  var msBtn = document.getElementById('openMonthSheetBtn');
  if(msBtn) msBtn.addEventListener('click', openMonthSheet);
  bindExtrasEvents(el, d, function(){ renderToday(); });

  el.querySelectorAll('.card-folded').forEach(function(fc){
    fc.addEventListener('click', function(){
      var period = parseInt(fc.getAttribute('data-period'),10);
      state.uiExpanded[d+'-'+period] = true;
      renderToday();
    });
  });

  bindDayCardEvents(el, d);
}

// 추가 진도 목록(리스트 + 새로 추가할 수 있는 드롭다운) HTML을 만든다.
// 카드 최초 렌더링과, 저장 전 임시(draft) 상태를 화면에 반영할 때 둘 다 이 함수를 재사용한다.
function buildExtraSectionHtml(classId, mainItemId, extraItems){
  var items = state.plans[classId] || [];
  var listHtml = extraItems.map(function(ex){
    var idx = items.findIndex(function(x){ return x.id===ex.itemId; });
    var it = idx!==-1 ? items[idx] : null;
    var title = it ? ((idx+1)+'. '+escapeHtml(it.title)) : '(삭제된 항목)';
    var miniBtns = STATUS_ORDER.map(function(s){
      return '<span class="mini-status-btn'+(ex.status===s?' on':'')+'" data-itemid="'+ex.itemId+'" data-status="'+s+'" title="'+STATUS_META[s].short+'">'+statusIconSvg(s,14)+'</span>';
    }).join('');
    return '<div class="extra-item-row" data-itemid="'+ex.itemId+'"><span class="grow">'+title+'</span>'+
      '<span class="mini-status-group">'+miniBtns+'</span>'+
      '<span class="remove-extra" data-itemid="'+ex.itemId+'">✕</span></div>';
  }).join('');
  var usedIds = {};
  if(mainItemId) usedIds[mainItemId] = true;
  extraItems.forEach(function(e){ usedIds[e.itemId] = true; });
  var addableItems = items.filter(function(it){ return !usedIds[it.id]; });
  var addHtml = addableItems.length ?
    ('<div class="extra-add-row"><select class="extra-item-select">'+
      addableItems.map(function(it){ var i=items.indexOf(it); return '<option value="'+it.id+'">'+(i+1)+'. '+escapeHtml(it.title)+'</option>'; }).join('')+
      '</select><button type="button" class="btn ghost small add-extra-btn">추가</button></div>')
    : (items.length ? '<p class="small-note" style="margin:4px 0 0;">추가할 수 있는 진도 항목이 없어요.</p>' : '');
  return { listHtml: listHtml, addHtml: addHtml };
}

function renderDayCard(dateStr, period, classId, isFocus, isMakeup){
  var cls = getClass(classId);
  if(!cls) return '';
  var rec = getRecords(dateStr).find(function(r){ return r.period===period; }) || {};
  var items = state.plans[classId] || [];
  var status = rec.status || 'pending';
  var mainItemId = recMainItemId(rec);
  var extraItems = recExtraItems(rec);
  var makeupBadge = isMakeup ? '<span class="stamp" style="background:var(--gray-100);color:var(--gray-700);">보강</span>' : '';

  if(rec.excused){
    var reasonLabel = rec.reason || '개인 사정';
    return '<div class="card" data-period="'+period+'" data-class="'+classId+'">'+
      '<div class="card-head"><span class="period-tag">'+periodTagLabel(period)+'</span>'+
      '<span class="class-chip" style="background:'+cls.color+'">'+escapeHtml(cls.name)+'</span>'+makeupBadge+'</div>'+
      '<div class="excused-note">'+escapeHtml(reasonLabel)+'로 수업이 없었어요.</div>'+
      '<div class="excused-undo">기록 취소하고 되돌리기</div>'+
    '</div>';
  }

  var opts = '<option value="">— 항목 선택 (직접 입력) —</option>';
  items.forEach(function(it,i){
    var label = (i+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' ('+escapeHtml(it.targetPage)+')'):'')+(it.done?' ✓':'');
    opts += '<option value="'+it.id+'"'+(mainItemId===it.id?' selected':'')+'>'+label+'</option>';
  });

  // 이 카드가 이미 저장된 적이 있으면(=명시적으로 [진도 저장]을 눌렀으면) 상단에 저장됨 표시를 보여준다.
  // 예전 버전에서 자동저장으로 만들어진 기록(rec.saved가 없는 경우)도 저장된 것으로 취급한다.
  var isSaved = !!(rec.saved || mainItemId || extraItems.length);
  var stamp = isSaved ? '<span class="stamp" data-fold="'+period+'" title="눌러서 접기">'+STATUS_META[status].short+' · 저장됨</span>' : '';
  var memo = rec.memo || '';
  var presenter = rec.presenter || '';

  // '지난 진도' 조회 영역: 교사가 수업 직전 가장 먼저 확인하는 정보라 카드 맨 위에
  // 크고 굵은 하이라이트 블록(Hero)으로 따로 분리해서 보여준다.
  // 오늘 날짜를 포함해서, 이 반에 저장된 진도 기록 중 가장 최근 것을 무조건 보여준다.
  var cst = classStats(classId);
  var prevHtml;
  if(cst.last && cst.last.doneDate){
    var lm = STATUS_META[cst.last.status||'done'];
    prevHtml = '<div class="prev-hero"><div class="prev-hero-label">지난 진도</div>'+
      '<div class="prev-hero-value">'+escapeHtml(cst.last.title)+(cst.last.donePage?('<br>'+escapeHtml(cst.last.donePage)):'')+'</div>'+
      '<div class="prev-hero-meta">'+statusIconSvg(cst.last.status||'done',13)+'<span>'+(lm?lm.short:'')+' · '+niceDate(cst.last.doneDate)+'</span></div>'+
    '</div>';
  } else {
    prevHtml = '<div class="prev-hero empty"><div class="prev-hero-label">지난 진도</div>'+
      '<div class="prev-hero-value">아직 기록된 진도가 없어요</div></div>';
  }

  var statusBtns = STATUS_ORDER.map(function(s){
    return '<div class="status-btn st-'+s+(status===s?' on':'')+'" data-status="'+s+'">'+
      '<span class="status-ico">'+statusIconSvg(s,18)+'</span>'+
      '<span class="status-label">'+STATUS_META[s].short+'</span>'+
    '</div>';
  }).join('');

  // 오늘 원래 나갈 항목(메인) 말고 추가로 더 나간 진도가 있으면 따로 기록한다.
  // 메인 항목과 상태가 섞이지 않도록, 추가 항목은 각자 자기 상태를 따로 갖는다.
  var extraParts = buildExtraSectionHtml(classId, mainItemId, extraItems);
  var hasExtra = extraItems.length>0;
  var focusBadge = isFocus ? '<div class="now-focus-badge">'+statusIconSvg('inProgress',12)+' 지금 이 시간</div>' : '';

  return '<div class="card'+(isFocus?' is-focus':'')+'" data-period="'+period+'" data-class="'+classId+'"'+(isMakeup?' data-makeup="1"':'')+'>'+
    '<div class="card-head"><span class="period-tag">'+periodTagLabel(period)+'</span>'+
    '<span class="class-chip" style="background:'+cls.color+'">'+escapeHtml(cls.name)+'</span>'+makeupBadge+stamp+'</div>'+
    focusBadge+
    prevHtml+
    '<div class="card-section-divider">오늘 진도 입력</div>'+
    '<div class="field-row"><label>진도 항목</label><select class="f-item">'+opts+'</select></div>'+
    '<div class="field-row"><label>오늘 어디까지 (쪽/문단/번호)</label><div class="page-row">'+
      '<input type="text" class="f-page" placeholder="예: 45쪽까지" value="'+escapeHtml(rec.pageText||'')+'">'+
    '</div></div>'+
    '<div class="field-row"><label>진행 상태</label><div class="status-seg">'+statusBtns+'</div></div>'+
    '<div class="memo-toggle extra-toggle">추가 진도 기록 '+(hasExtra?'수정':'추가')+'</div>'+
    '<div class="memo-wrap extra-wrap'+(hasExtra?' show':'')+'">'+
      '<p class="small-note" style="margin:2px 0 8px;">오늘 원래 나갈 진도 말고 추가로 더 나간 항목이 있으면 여기서 따로 기록하세요. 메인 항목 상태와는 별개로 관리돼요.</p>'+
      '<div class="extra-section"><div class="extra-list">'+extraParts.listHtml+'</div>'+extraParts.addHtml+'</div>'+
    '</div>'+
    '<div class="memo-toggle">발표/메모 '+((memo||presenter)?'수정':'추가')+'</div>'+
    '<div class="memo-wrap'+((memo||presenter)?' show':'')+'">'+
      '<div class="field-row"><label>오늘 발표자 (있으면)</label><input type="text" class="f-presenter" placeholder="예: 김OO, 박OO" value="'+escapeHtml(presenter)+'"></div>'+
      '<div class="field-row"><label>메모 (발표 내용, 특이사항 등)</label><textarea class="f-memo" rows="2" placeholder="예: 김OO 이차방정식 풀이 발표">'+escapeHtml(memo)+'</textarea></div>'+
    '</div>'+
    '<button type="button" class="btn save-progress-btn" style="width:100%;margin-top:14px;">진도 저장</button>'+
    '<div class="memo-toggle">오늘 수업 없었나요?</div>'+
    '<div class="memo-wrap"><div class="excuse-toggle-row">'+
      EXCUSE_REASONS.map(function(r){ return '<span class="excuse-btn" data-reason="'+r+'">'+r+'</span>'; }).join('')+
    '</div></div>'+
  '</div>';
}

// 실수로 잘못 눌러서 저장되는 걸 막기 위한 확인 모달. 확인하면 onConfirm 실행.
function openSaveConfirmModal(onConfirm){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-box">'+
    '<h3>진도를 저장하시겠습니까?</h3>'+

  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#saveConfirmCancel').addEventListener('click', function(){ overlay.remove(); });
  overlay.querySelector('#saveConfirmOk').addEventListener('click', function(){
    overlay.remove();
    onConfirm();
  });
}

function bindOneCard(card, dateStr, isFocus, isMakeup){
  var period = parseInt(card.getAttribute('data-period'),10);
  var classId = card.getAttribute('data-class');

  function rerenderCard(){
    var newHtml = renderDayCard(dateStr, period, classId, isFocus, isMakeup);
    var tmp = document.createElement('div');
    tmp.innerHTML = newHtml;
    var newCard = tmp.firstElementChild;
    card.replaceWith(newCard);
    bindOneCard(newCard, dateStr, isFocus, isMakeup);
  }

  if(card.querySelector('.excused-undo')){
    card.querySelector('.excused-undo').addEventListener('click', function(){
      var rec = getRecords(dateStr).find(function(r){ return r.period===period; }) || { period:period, classId:classId, status:'pending', itemId:'', extraItems:[], pageText:'', presenter:'', memo:'' };
      rec.excused = false;
      setRecord(dateStr, period, rec).then(rerenderCard);
    });
    return;
  }

  // 화면에서 만지작거리는 동안은 저장하지 않고, [진도 저장] 버튼을 눌러 확인한 뒤에만 실제로 저장한다.
  // (실수로 상태 버튼을 잘못 누르거나 입력하다가 바로 저장돼버리는 걸 막기 위함)
  var savedRec = getRecords(dateStr).find(function(r){ return r.period===period; }) || {};
  var draft = {
    itemId: recMainItemId(savedRec),
    extraItems: recExtraItems(savedRec).map(function(e){ return { itemId:e.itemId, status:e.status }; })
  };

  function bindFoldTrigger(){
    var st = card.querySelector('.stamp[data-fold]');
    if(st) st.onclick = function(e){
      e.stopPropagation();
      delete state.uiExpanded[dateStr+'-'+period];
      renderToday();
    };
  }
  bindFoldTrigger();

  function refreshExtraSection(){
    var parts = buildExtraSectionHtml(classId, draft.itemId, draft.extraItems);
    var section = card.querySelector('.extra-section');
    section.innerHTML = '<div class="extra-list">'+parts.listHtml+'</div>'+parts.addHtml;
    var toggle = card.querySelector('.extra-toggle');
    toggle.textContent = '추가 진도 기록 '+(draft.extraItems.length?'수정':'추가');
    bindExtraControls();
  }
  function bindExtraControls(){
    var addExtraBtn = card.querySelector('.add-extra-btn');
    if(addExtraBtn){
      addExtraBtn.onclick = function(){
        var sel = card.querySelector('.extra-item-select');
        if(!sel || !sel.value) return;
        draft.extraItems.push({ itemId: sel.value, status: 'done' });
        refreshExtraSection();
      };
    }
    card.querySelectorAll('.remove-extra').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-itemid');
        draft.extraItems = draft.extraItems.filter(function(e){ return e.itemId!==id; });
        refreshExtraSection();
      };
    });
    card.querySelectorAll('.mini-status-btn').forEach(function(btn){
      btn.onclick = function(){
        var id = btn.getAttribute('data-itemid');
        var s = btn.getAttribute('data-status');
        draft.extraItems.forEach(function(e){ if(e.itemId===id) e.status = s; });
        refreshExtraSection();
      };
    });
  }
  bindExtraControls();

  card.querySelector('.f-item').addEventListener('change', function(){
    draft.itemId = this.value;
    var it = (state.plans[classId]||[]).find(function(x){ return x.id===draft.itemId; });
    if(it && it.targetPage && !card.querySelector('.f-page').value){
      card.querySelector('.f-page').value = it.targetPage;
    }
    refreshExtraSection(); // 메인 항목이 바뀌면 추가로 고를 수 있는 항목 목록도 달라지므로 새로 그린다
  });
  card.querySelectorAll('.status-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      card.querySelectorAll('.status-btn').forEach(function(b){ b.classList.toggle('on', b===btn); });
    });
  });
  card.querySelectorAll('.memo-toggle').forEach(function(toggle){
    toggle.addEventListener('click', function(){
      var wrap = toggle.nextElementSibling;
      if(wrap && wrap.classList.contains('memo-wrap')) wrap.classList.toggle('show');
    });
  });

  card.querySelector('.save-progress-btn').addEventListener('click', function(){
    openSaveConfirmModal(function(){
      var selectedStatusBtn = card.querySelector('.status-btn.on');
      var entry = {
        period: period,
        classId: classId,
        itemId: card.querySelector('.f-item').value || '',
        extraItems: draft.extraItems,
        pageText: card.querySelector('.f-page').value,
        status: selectedStatusBtn ? selectedStatusBtn.getAttribute('data-status') : 'pending',
        presenter: card.querySelector('.f-presenter').value,
        memo: card.querySelector('.f-memo').value,
        saved: true
      };
      var items = state.plans[classId] || [];
      if(entry.itemId){
        var it = items.find(function(i){ return i.id===entry.itemId; });
        if(it){
          it.status = entry.status;
          it.done = (entry.status==='done');
          if(entry.status!=='pending'){
            it.doneDate = dateStr;
            if(entry.pageText) it.donePage = entry.pageText;
          }
        }
      }
      entry.extraItems.forEach(function(ex){
        var it = items.find(function(i){ return i.id===ex.itemId; });
        if(it){
          it.status = ex.status;
          it.done = (ex.status==='done');
          if(ex.status!=='pending') it.doneDate = dateStr;
        }
      });
      Promise.all([ setRecord(dateStr, period, entry), savePlans() ]).then(function(){
        flashSaved();
        renderToday(); // 지연 없이 바로 완료 구역으로 접어서 내려보낸다
        checkPuzzleMilestone(); // 이 저장으로 전체 진도가 50%/100%에 새로 도달했으면 축하 팝업
      });
    });
  });

  card.querySelectorAll('.excuse-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var reason = btn.getAttribute('data-reason');
      openAbsenceConfirmModal(reason, classId, dateStr, period);
    });
  });
}

// '결강 처리' 누르면 바로 확정하지 않고, 실제로 보강을 잡을지부터 물어본다.
// 특정 날짜 하루만 다른 요일 시간표를 빌려 쓰게 한다 (예: 수요일에 화요일 시간표 적용).
// 설정 > 시간표 관리 하단에서 여는 일회성 요일 변경 모달. 날짜를 직접 골라서 적용한다.
function openDayOverrideModal(){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var opts = DAYS.map(function(dk){ return '<option value="'+dk+'">'+dk+'요일 시간표</option>'; }).join('');
  overlay.innerHTML = '<div class="modal-box">'+
    '<h3>일회성 요일 변경</h3>'+
    '<p class="small-note" style="margin:0 0 12px;">특정 날짜 하루만 다른 요일 시간표를 빌려서 보여줘요. D-day 남은 수업 횟수 계산에도 그대로 반영돼요.</p>'+
    '<div class="field-row"><label>날짜</label><input type="date" id="dayOverrideDateInput" value="'+todayStr()+'"></div>'+
    '<div class="field-row"><label>적용할 요일</label><select id="dayOverrideSelect">'+opts+'</select></div>'+
    '<p class="small-note" id="dayOverrideStatus" style="margin:-4px 0 10px;"></p>'+
    '<div class="modal-actions" id="dayOverrideActions">'+
      '<button class="btn ghost small" id="dayOverrideCancel">취소</button>'+
      '<button class="btn small" id="dayOverrideSave">적용</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#dayOverrideCancel').addEventListener('click', function(){ overlay.remove(); });

  function refreshStatus(){
    var dateVal = document.getElementById('dayOverrideDateInput').value;
    var statusEl = document.getElementById('dayOverrideStatus');
    var current = dateVal && state.settings.dayOverrides[dateVal];
    var existingClear = document.getElementById('dayOverrideClear');
    if(current){
      statusEl.textContent = niceDate(dateVal)+'('+dayKorOf(dateVal)+')은(는) 이미 '+current+'요일 시간표가 적용돼 있어요.';
      document.getElementById('dayOverrideSelect').value = current;
      if(!existingClear){
        var clearBtn = document.createElement('button');
        clearBtn.type = 'button';
        clearBtn.className = 'btn ghost small';
        clearBtn.id = 'dayOverrideClear';
        clearBtn.textContent = '원래대로';
        clearBtn.addEventListener('click', function(){
          delete state.settings.dayOverrides[dateVal];
          saveSettings().then(function(){ refreshStatus(); flashSaved(); });
        });
        document.getElementById('dayOverrideActions').insertBefore(clearBtn, document.getElementById('dayOverrideCancel'));
      }
    } else {
      statusEl.textContent = '';
      if(existingClear) existingClear.remove();
    }
  }
  refreshStatus();
  document.getElementById('dayOverrideDateInput').addEventListener('change', refreshStatus);

  overlay.querySelector('#dayOverrideSave').addEventListener('click', function(){
    var dateVal = document.getElementById('dayOverrideDateInput').value;
    var dk = document.getElementById('dayOverrideSelect').value;
    if(!dateVal){ alert('날짜를 선택해주세요.'); return; }
    state.settings.dayOverrides[dateVal] = dk;
    saveSettings().then(function(){
      overlay.remove();
      if(state.currentView==='today') renderToday();
      flashSaved();
    });
  });
}

function openAbsenceConfirmModal(reason, classId, dateStr, period){

    '<h3>'+escapeHtml(reason)+'(으)로 결강 처리</h3>'+
    '<p class="small-note" style="margin:0 0 14px;">실제로 보강을 진행하시나요?</p>'+
    '<div class="modal-actions" style="flex-direction:column;gap:8px;">'+
      '<button class="btn small" id="absenceMakeupYes" style="width:100%;">네, 보강 예정이에요</button>'+
      '<button class="btn ghost small" id="absenceMakeupNo" style="width:100%;">아니오, 그냥 결강이에요</button>'+
    '</div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });

// 보강 날짜/교시를 잡으면, 그 날짜에 '보강 수업' 카드가 자동으로 생겨서 거기서 진도를 기록할 수 있다.
// (이미 그 교시에 다른 수업이 있으면 겹치지 않게, 비어있는 교시만 고를 수 있게 한다)
function openMakeupScheduleModal(classId, fromDate, fromPeriod){
  var cls = getClass(classId);
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var defaultDate = addDays(fromDate, 1);
  overlay.innerHTML = '<div class="modal-box">'+
    '<h3>보강 일정 잡기</h3>'+
    '<p class="small-note" style="margin:0 0 12px;">'+(cls?escapeHtml(cls.name):'')+' · 보강할 날짜와 교시를 골라주세요.</p>'+
    '<div class="field-row"><label>보강 날짜</label><input type="date" id="makeupDateInput" value="'+defaultDate+'"></div>'+
    '<div class="field-row"><label>보강 교시</label><select id="makeupPeriodSelect"></select></div>'+
    '<div class="modal-actions"><button class="btn ghost small" id="makeupCancel">취소</button><button class="btn small" id="makeupSave">저장</button></div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#makeupCancel').addEventListener('click', function(){ overlay.remove(); renderToday(); });

  function refreshPeriodOptions(){
    var dateVal = document.getElementById('makeupDateInput').value;
    var used = {};
    if(dateVal) scheduleFor(dateVal).forEach(function(s){ used[s.period] = true; });
    var n = state.settings.periodsPerDay || 7;
    var sel = document.getElementById('makeupPeriodSelect');
    var opts = '';
    for(var p=1; p<=n; p++){
      if(used[p]) continue;
      opts += '<option value="'+p+'">'+p+'교시</option>';
    }
    sel.innerHTML = opts || '<option value="">이 날짜엔 빈 교시가 없어요</option>';
  }
  refreshPeriodOptions();
  document.getElementById('makeupDateInput').addEventListener('change', refreshPeriodOptions);

  overlay.querySelector('#makeupSave').addEventListener('click', function(){
    var dateVal = document.getElementById('makeupDateInput').value;
    var periodVal = document.getElementById('makeupPeriodSelect').value;
    if(!dateVal || !periodVal){ alert('보강 날짜와 빈 교시를 선택해주세요.'); return; }
    var entry = { id:uid(), classId:classId, date:dateVal, period:parseInt(periodVal,10), fromDate:fromDate, fromPeriod:fromPeriod };
    state.settings.makeupClasses.push(entry);
    saveSettings().then(function(){
      overlay.remove();
      renderToday();
    });
  });
}

function goToDate(dateStr){
  var ym = ymOf(dateStr);
  return ensureMonth(ym).then(function(){
    if(state.currentView==='today') renderToday();
  });
}

// 날짜를 바꿀 때 화면이 옆으로 살짝 밀리면서 바뀌게 (스와이프/화살표 버튼 공통으로 사용)
function animateDayChange(direction){
  var el = document.getElementById('view-today');
  if(!el) return;
  var exitX = direction>0 ? -16 : 16;   // 다음날(+1)이면 왼쪽으로 나가고, 전날(-1)이면 오른쪽으로 나간다
  var enterX = direction>0 ? 16 : -16;  // 새 내용은 반대쪽에서 들어온다
  el.style.transition = 'opacity .14s ease, transform .14s ease';
  el.style.opacity = '0';
  el.style.transform = 'translateX('+exitX+'px)';
  setTimeout(function(){
    state.currentDate = addDays(state.currentDate, direction);
    goToDate(state.currentDate).then(function(){
      el.style.transition = 'none';
      el.style.transform = 'translateX('+enterX+'px)';
      el.style.opacity = '0';
      void el.offsetWidth; // 강제 리플로우: transition 없이 순간이동시킨 뒤, 그 다음에 애니메이션을 다시 켠다
      el.style.transition = 'opacity .16s ease, transform .16s ease';
      requestAnimationFrame(function(){
        el.style.transform = 'translateX(0)';
        el.style.opacity = '1';
      });
    });
  }, 140);
}

(function setupTodaySwipe(){
  var el = document.getElementById('view-today');
  if(!el) return;
  var startX=0, startY=0, tracking=false;
  el.addEventListener('touchstart', function(e){
    if(e.touches.length!==1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - startX, dy = endY - startY;
    // 가로로 충분히, 세로보다 뚜렷하게 밀었을 때만 스와이프로 인정 (스크롤과 헷갈리지 않게)
    if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.5){
      animateDayChange(dx < 0 ? 1 : -1);
    }
  }, {passive:true});
})();

// ---------- render: CALENDAR ----------
function renderCalendar(){
  var el = document.getElementById('view-calendar');
  var ym = state.calYm;
  ensureMonth(ym).then(function(monthData){
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var first = new Date(y, m-1, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(y, m, 0).getDate();

    var html = '<div class="cal-head"><button class="icon-btn" id="calPrev">◀</button>';
    html += '<h2>'+y+'년 '+m+'월</h2><button class="icon-btn" id="calNext">▶</button></div>';
    html += '<div class="cal-grid">';
    ['일','월','화','수','목','금','토'].forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
    for(var i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
    for(var day=1; day<=daysInMonth; day++){
      var ds = ym+'-'+pad2(day);
      var isToday = ds===todayStr();
      var isHoliday = isHolidayEffective(ds);
      var isVacation = !isHoliday && !inAnySemester(ds);
      var isSelected = ds===state.calSelected;
      var recs = monthData[ds] || [];
      var exam = state.settings.exams.find(function(e){ return ds>=e.startDate && ds<=e.endDate; });
      var cls = 'cal-cell'+(isToday?' today':'')+((isHoliday||isVacation)?' holiday':'')+(isSelected?' selected':'');
      var dotsHtml = '';
      var seen = {};
      recs.forEach(function(r){
        if(seen[r.classId]) return; seen[r.classId]=true;
        var c = getClass(r.classId);
        if(c) dotsHtml += '<span class="dot" style="background:'+c.color+'"></span>';
      });
      var stampMini = recs.some(function(r){ return r.status==='done'; }) ? '<span class="stamp-mini"></span>' : '';
      var eventLabel = '';
      if(exam){ eventLabel = exam.name; }
      else if(isHoliday){
        var autoH = findAutoHoliday(ds);
        var neisH = findNeisEvent(ds);
        if(autoH && isAutoHolidayActive(ds)) eventLabel = autoH.name;
        else if(isSuneungDate(ds)) eventLabel = '대학수학능력시험일';
        else if(neisH && neisH.classified==='holiday') eventLabel = neisH.name;
        else eventLabel = '휴업일';
      } else if(isVacation){ eventLabel = '방학'; }
      else {
        var neisEv = findNeisEvent(ds);
        if(neisEv) eventLabel = neisEv.name;
      }
      html += '<div class="'+cls+'" data-date="'+ds+'"><span class="num">'+day+'</span>'+
        (exam?'<span class="exam-flag"></span>':'')+
        (eventLabel?('<div class="event-label">'+escapeHtml(eventLabel)+'</div>'):'')+
        '<div class="dots">'+dotsHtml+'</div>'+stampMini+'</div>';
    }
    html += '</div>';

    if(state.settings.classes.length){
      html += '<div class="legend">';
      state.settings.classes.forEach(function(c){
        html += '<div class="item"><span class="sw" style="background:'+c.color+'"></span>'+escapeHtml(c.name)+'</div>';
      });
      html += '<div class="item"><span class="sw" style="background:var(--coral-deep)"></span>시험일</div>';
      html += '<div class="item"><span class="sw" style="background:var(--coral-deep)"></span>진도 완료</div>';
      html += '<div class="item"><span class="sw" style="background:var(--holiday-bg);border:1px solid var(--coral)"></span>휴업일</div>';
      html += '</div>';
    }

    html += '<div class="day-panel" id="dayPanel"></div>';
    el.innerHTML = html;

    document.getElementById('calPrev').onclick = function(){ shiftMonth(-1); };
    document.getElementById('calNext').onclick = function(){ shiftMonth(1); };
    el.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
      cell.addEventListener('click', function(){
        state.calSelected = cell.getAttribute('data-date');
        renderCalendar();
      });
    });

    if(state.calSelected){
      renderDayPanel(state.calSelected);
    }
  });
}

function shiftYm(ym, delta){
  var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
  m += delta;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  return y+'-'+pad2(m);
}
function shiftMonth(delta){
  state.calYm = shiftYm(state.calYm, delta);
  renderCalendar();
}

// ---------- 오늘 탭 상단 주간 캘린더 ----------
function getWeekDates(dateStr){
  var dow = parseDate(dateStr).getDay();
  var diffToMonday = (dow===0) ? -6 : (1-dow);
  var monday = addDays(dateStr, diffToMonday);
  var days = [];
  for(var i=0;i<5;i++) days.push(addDays(monday, i));
  return days;
}
// 그 날짜에 학사일정(시험/학교행사 등)이 있는지 — 주간 스트립의 점 표시에 쓴다.
function dateHasAcademicEvent(ds){
  if(state.settings.exams.some(function(e){ return ds>=e.startDate && ds<=e.endDate; })) return true;
  if(findNeisEvent(ds)) return true;
  var autoH = findAutoHoliday(ds);
  if(autoH && isAutoHolidayActive(ds)) return true;
  return false;
}
function buildWeekStripHtml(centerDateStr){
  var days = getWeekDates(centerDateStr);
  var labels = ['월','화','수','목','금'];
  var html = '<div class="week-strip">';
  days.forEach(function(ds, i){
    var isSelected = ds===centerDateStr;
    var isToday = ds===todayStr();
    var hasEvent = dateHasAcademicEvent(ds);
    html += '<div class="week-cell'+(isSelected?' selected':'')+(isToday?' is-today':'')+'" data-date="'+ds+'">'+
      '<span class="wc-dow">'+labels[i]+'</span>'+
      '<span class="wc-num">'+parseInt(ds.slice(8,10),10)+'</span>'+
      (hasEvent?'<span class="wc-dot"></span>':'')+
    '</div>';
  });
  html += '</div>';
  return html;
}
// 주간 전략 안에서 다른 날짜를 탭했을 때: 방향 없이 살짝 페이드로 전환
function animateDayJump(dateStr){
  var el = document.getElementById('view-today');
  if(!el || dateStr===state.currentDate){ if(dateStr!==state.currentDate){ state.currentDate=dateStr; goToDate(dateStr);} return; }
  el.style.transition = 'opacity .12s ease';
  el.style.opacity = '0';
  setTimeout(function(){
    state.currentDate = dateStr;
    goToDate(dateStr).then(function(){
      requestAnimationFrame(function(){ el.style.opacity = '1'; });
    });
  }, 100);
}

// 이번 주를 벗어난 날짜로 가고 싶을 때 여는 월간 달력 바텀시트

      var exam = state.settings.exams.find(function(e){ return ds>=e.startDate && ds<=e.endDate; });
      var cls = 'cal-cell'+(isToday?' today':'')+((isHoliday||isVacation)?' holiday':'')+(isSelected?' selected':'');
      var dotsHtml='', seen={};
      recs.forEach(function(r){ if(seen[r.classId]) return; seen[r.classId]=true; var c=getClass(r.classId); if(c) dotsHtml += '<span class="dot" style="background:'+c.color+'"></span>'; });
      html += '<div class="'+cls+'" data-date="'+ds+'"><span class="num">'+day+'</span>'+(exam?'<span class="exam-flag"></span>':'')+'<div class="dots">'+dotsHtml+'</div></div>';
    }

    document.getElementById('msNext').onclick = function(){ monthSheetYm = shiftYm(monthSheetYm,1); renderMonthSheet(); };

        var ds = cell.getAttribute('data-date');

        goToDate(ds);

function renderDayPanel(dateStr){
  var panel = document.getElementById('dayPanel');
  if(!panel) return;
  panel.innerHTML = '<h3>'+niceDate(dateStr)+' ('+dayKorOf(dateStr)+') 기록</h3><div id="dayPanelCards"></div>';
  var cardsEl = document.getElementById('dayPanelCards');
  var status = dayStatus(dateStr);
  var sched = status==='school' ? scheduleFor(dateStr) : [];
  var html = '';
  if(status==='vacation'){
    html = '<p class="small-note">방학 기간이에요.</p>';
  } else if(status==='holiday'){
    var autoH = findAutoHoliday(dateStr);
    html = '<p class="small-note">'+(autoH?autoH.name:'휴업일')+'이에요.</p>';
  } else if(sched.length===0){
    html = '<p class="small-note">이 날은 등록된 수업이 없어요.</p>';
  } else {
    sched.forEach(function(s){
      var blockingExam = findBlockingExam(dateStr, s.classId, s.period);
      html += blockingExam ? renderExamBlockedCard(s.period, s.classId, blockingExam) : renderDayCard(dateStr, s.period, s.classId);
    });
  }
  html += renderExtrasSection(dateStr);
  cardsEl.innerHTML = html;
  bindDayCardEvents(cardsEl, dateStr);
  bindExtrasEvents(cardsEl, dateStr, function(){ renderDayPanel(dateStr); });
}

// ---------- render: CLASSES ----------
// 반 전체 완료 현황(퍼즐 상태)을 어디서든 계산할 수 있는 공용 함수.
// '반별 현황' 화면을 안 보고 있어도(예: 오늘 화면에서 저장 직후) 마일스톤 체크에 쓴다.
// 반 하나가 통째로 끝나야만 올라가는 게 아니라, 담당하는 모든 반의 진도 항목을 합쳐서
// (완료한 항목 수 / 전체 항목 수)로 계산한다 — 항목 하나만 완료해도 그만큼 바로 반영된다.
// 담당하는 모든 반의 진도 항목을 합쳐서 전체 진행률을 계산한다.
function computeOverallProgress(){
  var totalItems = 0, doneItems = 0;
  state.settings.classes.forEach(function(c){
    var st = classStats(c.id);
    totalItems += st.total;
    doneItems += st.done;
  });
  var fraction = totalItems>0 ? doneItems/totalItems : 0;
  return { totalItems:totalItems, doneItems:doneItems, fraction:fraction };
}

function renderClasses(){
  var el = document.getElementById('view-classes');
  if(state.settings.classes.length===0){
    el.innerHTML = emptyStateHtml('📊','반별 현황','설정에서 반을 먼저 등록해주세요.','settings');
    return;
  }
  var stats = state.settings.classes.map(function(c){
    return { cls:c, stat:classStats(c.id) };
  });
  var withPlans = stats.filter(function(s){ return s.stat.total>0; });
  var slowestId = null, fastestId = null;
  if(withPlans.length>1){
    var sorted = withPlans.slice().sort(function(a,b){ return a.stat.ratio-b.stat.ratio; });
    slowestId = sorted[0].stat.ratio < sorted[sorted.length-1].stat.ratio ? sorted[0].cls.id : null;
    fastestId = sorted[sorted.length-1].stat.ratio > sorted[0].stat.ratio ? sorted[sorted.length-1].cls.id : null;
  }
  stats.sort(function(a,b){ return a.stat.ratio-b.stat.ratio; });

  var html = '<h1 style="margin:6px 0 4px;">반별 진도 현황</h1>';
  html += '<button class="btn ghost small" id="weeklyReportBtn" style="margin-bottom:14px;">지난주 진도 요약 보기</button>';

  stats.forEach(function(s){
    var c = s.cls, st = s.stat;
    var pct = Math.round(st.ratio*100);
    html += '<div class="class-card">';
    html += '<div class="class-card-body">';
    html += '<div class="row1"><span class="class-chip" style="background:'+c.color+'">'+escapeHtml(c.name)+'</span>';
    if(st.total>0 && st.done>=st.total) html += '<span class="badge complete">진도 완료</span>';
    else if(c.id===slowestId) html += '<span class="badge slow">진도가 느려요</span>';
    else if(c.id===fastestId) html += '<span class="badge fast">순조로워요</span>';
    html += '</div>';
    if(st.total===0){
      html += '<p class="small-note" style="margin:0;">진도 계획이 등록되지 않았어요.</p>';
    } else {
      html += '<div class="stat-hero"><span class="stat-hero-num">'+pct+'%</span><span class="stat-hero-sub">'+st.done+' / '+st.total+' 항목 완료</span></div>';
      html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+pct+'%;background:'+c.color+'"></div></div>';
      html += '<div class="meta">';
      html += st.last ? ('마지막 진도: <b>'+escapeHtml(st.last.title)+'</b>'+(st.last.donePage?(' · '+escapeHtml(st.last.donePage)):'')+' · <span style="display:inline-flex;align-items:center;gap:4px;vertical-align:middle;">'+statusIconSvg(st.last.status||'done',13)+(STATUS_META[st.last.status||'done']?STATUS_META[st.last.status||'done'].short:'')+'</span> · '+niceDate(st.last.doneDate) ) : '아직 기록된 진도가 없어요';
      html += '<br>';
      html += st.next ? ('다음 진도: <b>'+escapeHtml(st.next.title)+'</b>') : '남은 진도 항목이 없어요';
      html += '</div>';
    }
    html += '</div></div>';
  });
  el.innerHTML = html;
  document.getElementById('weeklyReportBtn').addEventListener('click', function(){ showWeeklyReportModal(false); });
}

// 전체 진도가 50%, 100%에 새로 도달하는 순간마다(진도 저장 직후 등) 자동으로 축하 팝업 + 컨페티.
function checkPuzzleMilestone(){
  var p = computeOverallProgress();
  var last = state.settings.lastProgressMilestone || 0;
  var reached = p.fraction>=1 ? 100 : p.fraction>=(2/3) ? 66 : p.fraction>=(1/3) ? 33 : 0;
  if(reached > last){
    state.settings.lastProgressMilestone = reached;
    saveSettings();
    if(reached>=100){
      showMilestoneModal('전체 진도 완료!', '축하해요! 담당하신 반 전체 진도를 다 마치셨어요.', true);
    } else if(reached>=66){
      showMilestoneModal('진도 2/3 완료!', '전체 진도 '+p.doneItems+'/'+p.totalItems+' 항목 완료. 거의 다 왔어요!', true);
    } else if(reached>=33){
      showMilestoneModal('진도 1/3 완료!', '전체 진도 '+p.doneItems+'/'+p.totalItems+' 항목 완료. 좋은 출발이에요!', true);
    }
  } else if(reached < last){
    // 진도 계획이 늘어나는 등으로 비율이 다시 내려가면, 나중에 다시 채웠을 때 또 축하할 수 있도록 기준을 낮춰둔다
    state.settings.lastProgressMilestone = reached;
    saveSettings();
  }
}

function showMilestoneModal(title, desc, withConfetti){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-box" style="text-align:center;">'+
    '<h3>'+title+'</h3>'+
    '<p class="small-note" style="margin:0 0 4px;">'+desc+'</p>'+
    '<div class="modal-actions"><button class="btn small" id="milestoneCloseBtn" style="width:100%;">확인</button></div>'+
  '</div>';
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#milestoneCloseBtn').addEventListener('click', function(){ overlay.remove(); });
  if(withConfetti) triggerConfetti();
}

// 반 전체 진도 100% 달성 축하 컨페티. 있으면 짧은 햅틱도 같이(없으면 조용히 무시).
function triggerConfetti(){
  var colors = ['#B84F39','#E06D53','#464646','#D4A24C','#F2F1EF'];
  var container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);
  for(var i=0;i<52;i++){
    var p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (Math.random()*100)+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.35)+'s';
    p.style.animationDuration = (1.7+Math.random()*1.3)+'s';
    p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    container.appendChild(p);
  }
  setTimeout(function(){ container.remove(); }, 3300);
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics){
      window.Capacitor.Plugins.Haptics.impact({ style: 'medium' });
    }
  }catch(e){}
}


// ---------- render: EXAM D-day ----------
function renderExam(){
  var el = document.getElementById('view-exam');
  if(state.settings.classes.length===0){
    el.innerHTML = emptyStateHtml('⏳','시험 D-day','설정에서 반과 학사일정을 먼저 등록해주세요.','settings');
    return;
  }
  if(!state.examFilterTab) state.examFilterTab = 'all';
  var today = todayStr();
  var html = '<h1 style="margin:6px 0 4px;">시험 D-day</h1>';
  html += '<div class="tab-pills">';
  [['all','전체'],['auto','자동(학사일정)'],['manual','수동(직접 등록)']].forEach(function(t){
    html += '<div class="tab-pill'+(state.examFilterTab===t[0]?' active':'')+'" data-filter="'+t[0]+'">'+t[1]+'</div>';
  });
  html += '</div>';

  var showAuto = state.examFilterTab==='all' || state.examFilterTab==='auto';
  var showManual = state.examFilterTab==='all' || state.examFilterTab==='manual';

  if(showAuto){
    if(state.settings.exams.length===0){
      html += '<p class="small-note">등록된 시험이 없어요. 설정 &gt; 학사일정에서 모의고사·지필평가·수행평가·학교행사를 추가해보세요.</p>';
    }
    ['writtenExam','mock','performance','event'].forEach(function(type){
      var list = state.settings.exams.filter(function(e){ return e.type===type; })
        .slice().sort(function(a,b){ return a.startDate<b.startDate?-1:1; });
      if(!list.length) return;
      html += '<h3 style="margin:14px 0 8px;font-size:0.9375rem;color:var(--ink-soft);">'+EXAM_TYPES[type]+'</h3>';
      list.forEach(function(ex, exIdx){
        var diff = Math.ceil((parseDate(ex.startDate)-parseDate(today))/86400000);
        var ddayText = diff===0?'D-DAY':(diff>0?('D-'+diff):('D+'+(-diff)));
        var dateLabel = ex.startDate===ex.endDate
          ? (niceDate(ex.startDate)+' ('+dayKorOf(ex.startDate)+')')
          : (niceDate(ex.startDate)+' ~ '+niceDate(ex.endDate));
        html += '<div class="exam-card"><div class="exam-top"><span class="exam-name">'+escapeHtml(ex.name)+'</span><span class="dday">'+ddayText+'</span></div>';
        html += '<div class="exam-date">'+dateLabel+'</div>';
        if(type==='writtenExam'){
          var prevExam = list[exIdx-1] || null;
          var startOrder = (prevExam && prevExam.examTargetOrder) ? prevExam.examTargetOrder : 0;
          // 수업 횟수도 진도 목표와 같은 기준으로 세야 한다: 이전 지필평가가 있으면 그 시험이 끝난 날 이후부터,
          // 이번 시험 날짜까지의 수업만 "이번 시험 범위를 위한 수업"으로 센다. (오늘이 이전 시험보다 늦으면 오늘부터)
          var sessionsFrom = prevExam && prevExam.endDate > today ? prevExam.endDate : today;
          state.settings.classes.forEach(function(c){
            var planItems = state.plans[c.id] || [];
            var st = examTargetStats(c.id, ex, startOrder);
            var remain = st.remain;
            var sessions = diff>0 ? countSessions(c.id, sessionsFrom, ex.startDate) : 0;
            var tag='', tagClass='';
            if(planItems.length===0){ tag='진도계획 없음'; tagClass='tight'; }
            else if(remain<=0){ tag='진도 완료'; tagClass='done'; }
            else if(diff<=0){ tag='시험 지남'; tagClass='danger'; }
            else if(sessions===0){ tag='남은 수업 없음'; tagClass='danger'; }
            else {
              var pace = remain/sessions;
              if(pace<=1){ tag='여유 있어요'; tagClass='ok'; }
              else if(pace<=1.8){ tag='1회당 '+pace.toFixed(1)+'개씩'; tagClass='tight'; }
              else { tag='1회당 '+pace.toFixed(1)+'개씩 (빠듯)'; tagClass='danger'; }
            }
            html += '<div class="pace-row"><span class="cname" style="color:'+darken(c.color,0.45)+'">'+escapeHtml(c.name)+
              (st.rangeLabel?' <span style="font-size:0.6875rem;color:var(--ink-faint);font-weight:400;">('+st.rangeLabel+')</span>':'')+'</span>'+
              '<span><span class="pace-num-sub">남은 </span><span class="pace-num">'+Math.max(remain,0)+'개</span><span class="pace-num-sub"> · 수업 </span><span class="pace-num">'+sessions+'회</span></span>'+
              '<span class="pace-tag '+tagClass+'">'+tag+'</span></div>';
          });
        }
        html += '</div>';
      });
    });
  }

  if(showManual){
    html += '<h3 style="margin:14px 0 8px;font-size:0.9375rem;color:var(--ink-soft);">수동 목표일</h3>';
    state.settings.customDdays.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(dd){
      var diff = Math.ceil((parseDate(dd.date)-parseDate(today))/86400000);
      var ddayText = diff===0?'D-DAY':(diff>0?('D-'+diff):('D+'+(-diff)));
      html += '<div class="exam-card"><div class="exam-top"><span class="exam-name">'+escapeHtml(dd.name)+'</span><span class="dday">'+ddayText+'</span></div>'+
        '<div class="exam-date">'+niceDate(dd.date)+' ('+dayKorOf(dd.date)+')</div>'+
        '<div style="text-align:right;"><span class="del-dday" data-id="'+dd.id+'" style="font-size:0.75rem;color:var(--rose-deep);cursor:pointer;text-decoration:underline;">삭제</span></div></div>';
    });
    html += '<div class="settings-section"><h3 style="font-size:0.875rem;">목표일 추가</h3>'+
      '<div class="field-row"><label>이름 <span class="req">*</span></label><input type="text" id="ddayName" placeholder="예: 3단원 마감, 수행평가 제출 마감"></div>'+
      '<div class="field-row"><label>날짜 <span class="req">*</span></label><input type="date" id="ddayDate"></div>'+
      '<button class="btn small" id="addDdayBtn">추가</button></div>';
  }

  el.innerHTML = html;

  el.querySelectorAll('.tab-pill[data-filter]').forEach(function(p){
    p.addEventListener('click', function(){ state.examFilterTab = p.getAttribute('data-filter'); renderExam(); });
  });
  var addBtn = document.getElementById('addDdayBtn');
  if(addBtn){
    addBtn.addEventListener('click', function(){
      var name = document.getElementById('ddayName').value.trim();
      var date = document.getElementById('ddayDate').value;
      if(!name || !date) return;
      state.settings.customDdays.push({ id:uid(), name:name, date:date });
      saveSettings().then(function(){ renderExam(); flashSaved(); });
    });
  }
  el.querySelectorAll('.del-dday').forEach(function(x){
    x.addEventListener('click', function(){
      var id = x.getAttribute('data-id');
      if(!confirm('이 목표일을 삭제할까요?')) return;
      var removed = state.settings.customDdays.find(function(d){ return d.id===id; });
      state.settings.customDdays = state.settings.customDdays.filter(function(d){ return d.id!==id; });
      saveSettings().then(function(){
        renderExam(); flashSaved();
        if(removed){
          showUndoToast('"'+removed.name+'" 삭제됨', function(){
            state.settings.customDdays.push(removed);
            saveSettings().then(function(){ renderExam(); flashSaved(); });
          });
        }
      });
    });
  });
}

function renderSettingsDisplay(body){
  var curScale = state.settings.fontScale || 1;
  var curTheme = state.settings.themeMode || 'system';
  var themeOpts = [['system','자동'],['light','라이트'],['dark','다크']];
  var html = '<div class="fontsize-control">'+
    '<span class="fs-label">글씨 크기</span>'+
    '<div style="display:flex;align-items:center;gap:10px;">'+
      '<button class="fs-btn" id="fsMinus">−</button>'+
      '<span class="fs-value">'+Math.round(curScale*100)+'%</span>'+
      '<button class="fs-btn" id="fsPlus">+</button>'+
    '</div></div>';
  html += '<div class="fontsize-control" style="margin-top:8px;">'+
    '<span class="fs-label">화면 테마</span>'+
    '<div class="theme-seg">'+
      themeOpts.map(function(t){ return '<span class="theme-opt'+(curTheme===t[0]?' active':'')+'" data-mode="'+t[0]+'">'+t[1]+'</span>'; }).join('')+
    '</div></div>';
  body.innerHTML = html;
  function changeScale(delta){
    var idx = closestScaleIndex(state.settings.fontScale||1);
    idx = Math.max(0, Math.min(FONT_SCALE_STEPS.length-1, idx+delta));
    state.settings.fontScale = FONT_SCALE_STEPS[idx];
    applyFontScale();
    saveSettings().then(function(){ renderSettingsDisplay(body); flashSaved(); });
  }
  document.getElementById('fsMinus').addEventListener('click', function(){ changeScale(-1); });
  document.getElementById('fsPlus').addEventListener('click', function(){ changeScale(1); });
  body.querySelectorAll('.theme-opt').forEach(function(opt){
    opt.addEventListener('click', function(){
      state.settings.themeMode = opt.getAttribute('data-mode');
      applyTheme();
      saveSettings().then(function(){ renderSettingsDisplay(body); flashSaved(); });
    });
  });
}
