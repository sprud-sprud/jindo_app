<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#F6F4EF;
    --bg-soft:#EEEAE1;
    --card:#FFFFFF;
    --ink:#2E2C28;
    --ink-soft:#847E73;
    --ink-faint:#C7C1B4;
    --line:#E2DDD1;
    --sage:#7E9A74;
    --sage-deep:#48603F;
    --sage-bg:#E6EDE2;
    --coral:#BD7355;
    --coral-deep:#7C4229;
    --coral-bg:#F1E2D8;
    --lav:#8D82A8;
    --lav-deep:#54486F;
    --lav-bg:#E7E3EF;
    --butter:#B5924A;
    --butter-deep:#71581F;
    --butter-bg:#EFE7D3;
    --rose:#AD6D68;
    --rose-deep:#733B36;
    --stamp:#7E9A74;
    --shadow: 0 1px 8px rgba(40,35,25,0.06);
    --shadow-soft: 0 1px 3px rgba(40,35,25,0.05);
    --radius: 12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Pretendard', sans-serif; font-weight:700; letter-spacing:-0.3px; }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:var(--bg);
  }
  .topbar{
    padding:20px 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .topbar .logo{
    font-family:'Pretendard', sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.3px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topbar .logo .dot{
    width:8px;height:8px;border-radius:2px;background:var(--sage);display:inline-block;
  }
  .save-badge{
    font-size:12px;
    color:var(--sage-deep);
    background:var(--sage-bg);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    transition:opacity .25s ease;
    white-space:nowrap;
  }
  .save-badge.show{opacity:1;}
  main{
    flex:1;
    padding:0 16px 96px;
    overflow-x:hidden;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty-state .big-emoji{font-size:34px;margin-bottom:10px;}
  .empty-state h2{color:var(--ink);font-size:22px;margin:6px 0 6px;}
  .empty-state p{font-size:14px;line-height:1.6;margin:0 0 18px;}
  button.btn{
    font-family:'Pretendard',sans-serif;
    font-weight:600;
    font-size:13.5px;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    background:var(--sage-deep);
    color:#fff;
    transition:opacity .12s ease;
  }
  button.btn:active{opacity:.85;}
  button.btn.ghost{
    background:var(--card);
    color:var(--sage-deep);
    border:1px solid var(--sage);
  }
  button.btn.coral{background:var(--coral-deep);}
  button.btn.small{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  button.icon-btn{
    background:none;border:none;cursor:pointer;
    font-size:15px;color:var(--ink-soft);
    padding:6px 10px;border-radius:7px;
    font-family:inherit;
  }
  button.icon-btn:active{background:var(--bg-soft);}

  .date-nav{
    display:flex;align-items:center;justify-content:space-between;
    margin:6px 0 16px;
  }
  .date-nav .date-display{text-align:center;flex:1;}
  .date-nav .date-display .weekday{
    font-size:13px;color:var(--ink-soft);letter-spacing:1px;
  }
  .date-nav .date-display h1{
    font-size:26px;margin:0;line-height:1.15;color:var(--ink);
  }
  .date-nav .date-display .today-jump{
    font-size:12px;color:var(--sage-deep);cursor:pointer;text-decoration:underline;
    display:inline-block;margin-top:2px;
  }

  .card{
    position:relative;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 16px 14px;
    margin-bottom:14px;
    border:1px solid var(--line);
    overflow:visible;
  }
  .card .card-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .period-tag{
    font-size:11.5px;font-weight:600;color:var(--ink-soft);
    background:var(--bg-soft);
    padding:3px 8px;border-radius:6px;
  }
  .class-chip{
    font-size:13.5px;font-weight:600;
    padding:3px 10px;border-radius:6px;
    color:var(--ink);
    background:var(--bg-soft);
  }
  select, input[type=text], textarea{
    font-family:'Pretendard',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 10px;
    width:100%;
    outline:none;
  }
  select:focus, input[type=text]:focus, textarea:focus{
    border-color:var(--sage);
  }
  .field-row{margin-bottom:9px;}
  .field-row label{
    font-size:11.5px;color:var(--ink-soft);font-weight:600;
    display:block;margin-bottom:4px;
  }
  .page-row{display:flex;gap:8px;}
  .page-row input{flex:1;}

  .check-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .check{
    display:flex;align-items:center;gap:7px;

function findAutoHoliday(dateStr){
  return LEGAL_HOLIDAYS.find(function(h){ return h.date===dateStr; }) || null;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDate(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(dateStr, n){ var d=parseDate(dateStr); d.setDate(d.getDate()+n); return fmtDate(d); }
function ymOf(dateStr){ return dateStr.slice(0,7); }
function dayKorOf(dateStr){ return DOW_KOR[parseDate(dateStr).getDay()]; }
function todayStr(){ return fmtDate(new Date()); }
function niceDate(dateStr){
  var d = parseDate(dateStr);
  return (d.getMonth()+1)+'월 '+d.getDate()+'일';
}
function darken(hex, amt){
  hex = hex.replace('#','');
  var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
  r = Math.max(0, Math.round(r*(1-amt))); g = Math.max(0, Math.round(g*(1-amt))); b = Math.max(0, Math.round(b*(1-amt)));
  return 'rgb('+r+','+g+','+b+')';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function defaultSettings(){
  var schedule = {};
  DAYS.forEach(function(d){ schedule[d] = new Array(7).fill(null); });
  return { classes: [], periodsPerDay: 7, schedule: schedule, exams: [], holidays: [], semesters: [], autoHolidaysEnabled: true, holidayExceptions: [] };
}
function isAutoHolidayActive(dateStr){
  return state.settings.autoHolidaysEnabled && !!findAutoHoliday(dateStr) && state.settings.holidayExceptions.indexOf(dateStr)===-1;
}
function isHolidayEffective(dateStr){
  return state.settings.holidays.indexOf(dateStr) !== -1 || isAutoHolidayActive(dateStr);
}
function inAnySemester(dateStr){
  if(!state.settings.semesters.length) return true;
  return state.settings.semesters.some(function(s){ return s.start && s.end && dateStr >= s.start && dateStr <= s.end; });
}
function dayStatus(dateStr){
  if(DAYS.indexOf(dayKorOf(dateStr)) === -1) return 'weekend';
  if(isHolidayEffective(dateStr)) return 'holiday';
  if(!inAnySemester(dateStr)) return 'vacation';
  return 'school';
}

var state = {

  currentView: 'today',
  currentDate: todayStr(),
  calYm: ymOf(todayStr()),

  settingsTab: 'classes',
  planClassId: null
};

// ---------- storage (localStorage 기반) ----------
var STORE_PREFIX = 'jindosucheop:';
function loadJSON(key, fallback){
  try{
    var v = localStorage.getItem(STORE_PREFIX+key);
    if(v==null) return Promise.resolve(fallback);
    return Promise.resolve(JSON.parse(v));
  }catch(e){
    console.error('불러오기 실패', key, e);
    return Promise.resolve(fallback);
  }
}
function saveJSON(key, obj){
  try{
    localStorage.setItem(STORE_PREFIX+key, JSON.stringify(obj));
    return Promise.resolve(true);
  }catch(e){
    console.error('저장 실패', key, e);
    return Promise.resolve(null);
  }
}
function listStoredKeys(prefix){
  var keys = [];
  try{
    for(var i=0; i<localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(STORE_PREFIX+prefix) === 0) keys.push(k.slice(STORE_PREFIX.length));
    }
  }catch(e){ console.error('목록 조회 실패', e); }
  return Promise.resolve(keys);
}
function flashSaved(){
  var b = document.getElementById('saveBadge');
  b.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(function(){ b.classList.remove('show'); }, 1200);
}

function ensureMonth(ym){
  if(state.monthCache[ym]) return Promise.resolve(state.monthCache[ym]);
  return loadJSON('records:'+ym, {}).then(function(data){
    Object.keys(data).forEach(function(dateStr){
      (data[dateStr]||[]).forEach(function(r){
        if(!r.status){
          r.status = (r.progressDone && r.problemDone) ? 'done' : (r.progressDone ? 'inProgress' : (r.problemDone ? 'practicing' : 'pending'));
        }
        if(r.presenter === undefined) r.presenter = '';
      });
    });
    state.monthCache[ym] = data;
    return data;
  });
}
function saveMonth(ym){
  return saveJSON('records:'+ym, state.monthCache[ym] || {});
}
function getRecords(dateStr){
  var ym = ymOf(dateStr);
  var m = state.monthCache[ym] || {};
  return m[dateStr] || [];
}
function setRecord(dateStr, period, entry){
  var ym = ymOf(dateStr);
  if(!state.monthCache[ym]) state.monthCache[ym] = {};
  var m = state.monthCache[ym];
  if(!m[dateStr]) m[dateStr] = [];
  var arr = m[dateStr];
  var idx = arr.findIndex(function(r){ return r.period === period; });
  if(idx >= 0) arr[idx] = entry; else arr.push(entry);
  arr.sort(function(a,b){ return a.period-b.period; });
  return saveMonth(ym).then(flashSaved);
}

function saveSettings(){ return saveJSON('settings', state.settings); }
function savePlans(){ return saveJSON('plans', state.plans); }

function getClass(id){ return state.settings.classes.find(function(c){ return c.id===id; }); }
function scheduleFor(dateStr){
  var dk = dayKorOf(dateStr);
  if(DAYS.indexOf(dk) === -1) return [];
  var arr = state.settings.schedule[dk] || [];
  var out = [];
  arr.forEach(function(classId, i){
    if(classId) out.push({ period:i+1, classId:classId });
  });
  return out;
}

function classStats(classId){
  var items = state.plans[classId] || [];
  var total = items.length;
  var done = items.filter(function(i){ return i.done; }).length;
  var touchedItems = items.filter(function(i){ return i.doneDate; });
  touchedItems.sort(function(a,b){ return a.doneDate < b.doneDate ? 1 : -1; });
  var last = touchedItems[0] || null;
  var next = items.find(function(i){ return !i.done; }) || null;
  return { total:total, done:done, ratio: total? done/total : 0, last:last, next:next };
}

function countSessions(classId, fromExclusive, toInclusive){
  if(fromExclusive >= toInclusive) return 0;
  var count = 0;
  var d = addDays(fromExclusive, 1);
  var guard = 0;
  while(d <= toInclusive && guard < 3660){
    guard++;
    var dk = dayKorOf(d);
    if(DAYS.indexOf(dk) !== -1 && !isHolidayEffective(d) && inAnySemester(d)){
      var arr = state.settings.schedule[dk] || [];
      arr.forEach(function(cid){ if(cid===classId) count++; });
    }
    d = addDays(d, 1);
  }
  return count;
}

  }).then(function(monthObjs){

      });

    });
    holidayRows.sort(function(a,b){ return a['날짜']<b['날짜']?-1:1; });
    var semesterRows = state.settings.semesters.map(function(s){
      return { '학기': s.name, '시작일': s.start, '종료일': s.end };
    });

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length?rows:[{'날짜':'','요일':'','교시':'','반':'','진도항목':'','쪽수':'','상태':'','발표자':'','메모':''}]), '일별기록');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planRows.length?planRows:[{'반':'','순서':'','항목':'','목표쪽수':'','완료여부':'','완료날짜':'','완료쪽수':''}]), '진도계획');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(schedRows), '시간표');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(examRows.length?examRows:[{'종류':'','이름':'','시작일':'','종료일':''}]), '시험일정');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(semesterRows.length?semesterRows:[{'학기':'','시작일':'','종료일':''}]), '학기');

    XLSX.writeFile(wb, '진도수첩_'+todayStr()+'.xlsx');
    btn.textContent = origText;
    btn.disabled = false;
  }).catch(function(e){

function renderDayCard(dateStr, period, classId){
  var cls = getClass(classId);
  if(!cls) return '';
  var rec = getRecords(dateStr).find(function(r){ return r.period===period; }) || {};
  var items = state.plans[classId] || [];
  var status = rec.status || 'pending';
  var selItemId = rec.itemId != null ? rec.itemId : '';

  var opts = '<option value="">— 항목 선택 (직접 입력) —</option>';
  items.forEach(function(it,i){
    var label = (i+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' ('+escapeHtml(it.targetPage)+')'):'')+(it.done?' ✓':'');
    opts += '<option value="'+it.id+'"'+(selItemId===it.id?' selected':'')+'>'+label+'</option>';
  });

  var stamp = (status==='done') ? '<span class="stamp">완료</span>' : '';
  var memo = rec.memo || '';
  var presenter = rec.presenter || '';

  var cst = classStats(classId);
  var prevHtml = '';
  if(cst.last && cst.last.doneDate && cst.last.doneDate < dateStr){
    var lm = STATUS_META[cst.last.status||'done'];
    prevHtml = '<div class="prev-progress">지난 진도: <b>'+escapeHtml(cst.last.title)+'</b>'+
      (cst.last.donePage?(' · '+escapeHtml(cst.last.donePage)):'')+' · '+(lm?lm.label:'')+' · '+niceDate(cst.last.doneDate)+'</div>';
  } else if(!cst.last){
    prevHtml = '<div class="prev-progress">아직 기록된 진도가 없어요.</div>';
  }

  var statusBtns = STATUS_ORDER.map(function(s){
    return '<div class="status-btn st-'+s+(status===s?' on':'')+'" data-status="'+s+'">'+STATUS_META[s].label+'</div>';
  }).join('');

  return '<div class="card" data-period="'+period+'" data-class="'+classId+'">'+
    '<div class="card-head"><span class="period-tag">'+period+'교시</span>'+
    '<span class="class-chip" style="background:'+cls.color+'">'+escapeHtml(cls.name)+'</span>'+stamp+'</div>'+
    prevHtml+
    '<div class="field-row"><label>진도 항목</label><select class="f-item">'+opts+'</select></div>'+
    '<div class="field-row"><label>오늘 어디까지 (쪽/문단/번호)</label><div class="page-row">'+
      '<input type="text" class="f-page" placeholder="예: 45쪽까지" value="'+escapeHtml(rec.pageText||'')+'">'+
    '</div></div>'+
    '<div class="field-row"><label>진행 상태</label><div class="status-seg">'+statusBtns+'</div></div>'+
    '<div class="memo-toggle">발표/메모 '+((memo||presenter)?'수정':'추가')+'</div>'+
    '<div class="memo-wrap'+((memo||presenter)?' show':'')+'">'+
      '<div class="field-row"><label>오늘 발표자 (있으면)</label><input type="text" class="f-presenter" placeholder="예: 김OO, 박OO" value="'+escapeHtml(presenter)+'"></div>'+
      '<div class="field-row"><label>메모 (발표 내용, 특이사항 등)</label><textarea class="f-memo" rows="2" placeholder="예: 김OO 이차방정식 풀이 발표">'+escapeHtml(memo)+'</textarea></div>'+
    '</div>'+
  '</div>';
}

function bindDayCardEvents(container, dateStr){
  container.querySelectorAll('.card[data-period]').forEach(function(card){
    var period = parseInt(card.getAttribute('data-period'),10);
    var classId = card.getAttribute('data-class');
    var curStatus = (getRecords(dateStr).find(function(r){ return r.period===period; }) || {}).status || 'pending';

    function currentEntry(){
      return {
        period: period,
        classId: classId,
        itemId: card.querySelector('.f-item').value || '',
        pageText: card.querySelector('.f-page').value,
        status: curStatus,
        presenter: card.querySelector('.f-presenter').value,
        memo: card.querySelector('.f-memo').value
      };
    }
    function refreshCardAfterSave(entry){
      var oldStamp = card.querySelector('.stamp');
      if(oldStamp) oldStamp.remove();
      if(entry.status==='done') card.querySelector('.card-head').insertAdjacentHTML('beforeend', '<span class="stamp">완료</span>');
      var itemSelect = card.querySelector('.f-item');
      var curVal = itemSelect.value;
      var opts = '<option value="">— 항목 선택 (직접 입력) —</option>';
      (state.plans[classId]||[]).forEach(function(x,i){
        var label = (i+1)+'. '+escapeHtml(x.title)+(x.targetPage?(' ('+escapeHtml(x.targetPage)+')'):'')+(x.done?' ✓':'');
        opts += '<option value="'+x.id+'"'+(curVal===x.id?' selected':'')+'>'+label+'</option>';
      });
      itemSelect.innerHTML = opts;
    }
    function persist(){
      var entry = currentEntry();
      var items = state.plans[classId] || [];
      if(entry.itemId){
        var it = items.find(function(i){ return i.id===entry.itemId; });
        if(it){
          it.status = entry.status;
          it.done = (entry.status==='done');
          if(entry.status!=='pending'){
            it.doneDate = dateStr;
            if(entry.pageText) it.donePage = entry.pageText;
          }
        }
      }
      Promise.all([ setRecord(dateStr, period, entry), savePlans() ]).then(function(){
        refreshCardAfterSave(entry);
      });
    }
    var debTimer=null;
    function debPersist(){ clearTimeout(debTimer); debTimer=setTimeout(persist, 400); }

    card.querySelector('.f-item').addEventListener('change', function(){
      var it = (state.plans[classId]||[]).find(function(x){ return x.id===this.value; }.bind(this));
      if(it && it.targetPage && !card.querySelector('.f-page').value){
        card.querySelector('.f-page').value = it.targetPage;
      }
      persist();
    });
    card.querySelector('.f-page').addEventListener('input', debPersist);
    card.querySelector('.f-memo').addEventListener('input', debPersist);
    card.querySelector('.f-presenter').addEventListener('input', debPersist);
    card.querySelectorAll('.status-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        curStatus = btn.getAttribute('data-status');
        card.querySelectorAll('.status-btn').forEach(function(b){ b.classList.toggle('on', b===btn); });
        persist();
      });
    });
    var memoToggle = card.querySelector('.memo-toggle');
    memoToggle.addEventListener('click', function(){
      card.querySelector('.memo-wrap').classList.toggle('show');
    });
  });
}

// ---------- render: CALENDAR ----------
function renderCalendar(){
  var el = document.getElementById('view-calendar');
  var ym = state.calYm;
  ensureMonth(ym).then(function(monthData){
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var first = new Date(y, m-1, 1);
    var startDow = first.getDay();
    var daysInMonth = new Date(y, m, 0).getDate();

    var html = '<div class="cal-head"><button class="icon-btn" id="calPrev">◀</button>';
    html += '<h2>'+y+'년 '+m+'월</h2><button class="icon-btn" id="calNext">▶</button></div>';
    html += '<div class="cal-grid">';
    ['일','월','화','수','목','금','토'].forEach(function(w){ html += '<div class="cal-dow">'+w+'</div>'; });
    for(var i=0;i<startDow;i++) html += '<div class="cal-cell empty"></div>';
    for(var day=1; day<=daysInMonth; day++){
      var ds = ym+'-'+pad2(day);
      var isToday = ds===todayStr();
      var isHoliday = isHolidayEffective(ds);
      var isVacation = !isHoliday && !inAnySemester(ds);
      var isSelected = ds===state.calSelected;
      var recs = monthData[ds] || [];
      var exam = state.settings.exams.find(function(e){ return ds>=e.startDate && ds<=e.endDate; });
      var cls = 'cal-cell'+(isToday?' today':'')+((isHoliday||isVacation)?' holiday':'')+(isSelected?' selected':'');
      var dotsHtml = '';
      var seen = {};
      recs.forEach(function(r){
        if(seen[r.classId]) return; seen[r.classId]=true;
        var c = getClass(r.classId);
        if(c) dotsHtml += '<span class="dot" style="background:'+c.color+'"></span>';
      });
      var stampMini = recs.some(function(r){ return r.status==='done'; }) ? '<span class="stamp-mini">✅</span>' : '';
      html += '<div class="'+cls+'" data-date="'+ds+'"><span class="num">'+day+'</span>'+
        (exam?'<span class="exam-flag">🚩</span>':'')+
        '<div class="dots">'+dotsHtml+'</div>'+stampMini+'</div>';
    }
    html += '</div>';

    if(state.settings.classes.length){
      html += '<div class="legend">';
      state.settings.classes.forEach(function(c){
        html += '<div class="item"><span class="sw" style="background:'+c.color+'"></span>'+escapeHtml(c.name)+'</div>';
      });
      html += '</div>';
    }

    html += '<div class="day-panel" id="dayPanel"></div>';
    el.innerHTML = html;

    document.getElementById('calPrev').onclick = function(){ shiftMonth(-1); };
    document.getElementById('calNext').onclick = function(){ shiftMonth(1); };
    el.querySelectorAll('.cal-cell[data-date]').forEach(function(cell){
      cell.addEventListener('click', function(){
        state.calSelected = cell.getAttribute('data-date');
        renderCalendar();
      });
    });

    if(state.calSelected){
      renderDayPanel(state.calSelected);
    }
  });
}

function shiftMonth(delta){
  var y = parseInt(state.calYm.slice(0,4),10), m = parseInt(state.calYm.slice(5,7),10);
  m += delta;
  if(m<1){ m=12; y--; } if(m>12){ m=1; y++; }
  state.calYm = y+'-'+pad2(m);
  renderCalendar();
}

function renderDayPanel(dateStr){
  var panel = document.getElementById('dayPanel');
  if(!panel) return;
  panel.innerHTML = '<h3>'+niceDate(dateStr)+' ('+dayKorOf(dateStr)+') 기록</h3><div id="dayPanelCards"></div>';
  var cardsEl = document.getElementById('dayPanelCards');
  var status = dayStatus(dateStr);
  var sched = status==='school' ? scheduleFor(dateStr) : [];
  if(status==='vacation'){
    cardsEl.innerHTML = '<p class="small-note">방학 기간이에요.</p>'; return;
  }
  if(status==='holiday'){
    var autoH = findAutoHoliday(dateStr);
    cardsEl.innerHTML = '<p class="small-note">'+(autoH?autoH.name:'휴업일')+'이에요.</p>'; return;
  }
  if(sched.length===0){
    cardsEl.innerHTML = '<p class="small-note">이 날은 등록된 수업이 없어요.</p>';
    return;
  }
  var html='';
  sched.forEach(function(s){ html += renderDayCard(dateStr, s.period, s.classId); });
  cardsEl.innerHTML = html;
  bindDayCardEvents(cardsEl, dateStr);
}

  if(ratio>=1) return 4;
  return Math.min(4, Math.floor(ratio*5));
}

var STAGE_LABEL = ['새싹','줄기·잎','나무','꽃나무','열매나무'];

function renderClasses(){
  var el = document.getElementById('view-classes');
  if(state.settings.classes.length===0){
    el.innerHTML = emptyStateHtml('📊','반별 현황','설정에서 반을 먼저 등록해주세요.','settings');
    return;
  }
  var stats = state.settings.classes.map(function(c){
    return { cls:c, stat:classStats(c.id) };
  });
  var withPlans = stats.filter(function(s){ return s.stat.total>0; });
  var slowestId = null, fastestId = null;
  if(withPlans.length>1){
    var sorted = withPlans.slice().sort(function(a,b){ return a.stat.ratio-b.stat.ratio; });
    slowestId = sorted[0].stat.ratio < sorted[sorted.length-1].stat.ratio ? sorted[0].cls.id : null;
    fastestId = sorted[sorted.length-1].stat.ratio > sorted[0].stat.ratio ? sorted[sorted.length-1].cls.id : null;
  }
  stats.sort(function(a,b){ return a.stat.ratio-b.stat.ratio; });

  var html = '<h1 style="margin:6px 0 4px;">반별 진도 현황</h1>';
  html += '<p class="small-note" style="margin:0 0 14px;">진도가 늘수록 나무가 자라요 — 새싹 → 줄기·잎 → 나무 → 꽃나무 → 열매나무</p>';
  stats.forEach(function(s){
    var c = s.cls, st = s.stat;
    var pct = Math.round(st.ratio*100);
    var stage = st.total>0 ? stageForRatio(st.ratio) : 0;
    html += '<div class="class-card">';
    html += '<div class="tree-wrap">'+treeSVG(stage, c.color)+'<div class="tree-label">'+STAGE_LABEL[stage]+'</div></div>';
    html += '<div class="class-card-body">';
    html += '<div class="row1"><span class="class-chip" style="background:'+c.color+'">'+escapeHtml(c.name)+'</span>';
    if(c.id===slowestId) html += '<span class="badge slow">진도가 느려요</span>';
    else if(c.id===fastestId) html += '<span class="badge fast">순조로워요</span>';
    html += '</div>';
    if(st.total===0){
      html += '<p class="small-note" style="margin:0;">진도 계획이 등록되지 않았어요.</p>';
    } else {
      html += '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:'+pct+'%;background:'+c.color+'"></div></div>';
      html += '<div class="meta"><b>'+st.done+' / '+st.total+'</b> 항목 완료 ('+pct+'%)<br>';
      html += st.last ? ('마지막 진도: <b>'+escapeHtml(st.last.title)+'</b>'+(st.last.donePage?(' · '+escapeHtml(st.last.donePage)):'')+' · '+(STATUS_META[st.last.status||'done']?STATUS_META[st.last.status||'done'].label:'')+' · '+niceDate(st.last.doneDate) ) : '아직 기록된 진도가 없어요';
      html += '<br>';
      html += st.next ? ('다음 진도: <b>'+escapeHtml(st.next.title)+'</b>') : '남은 진도 항목이 없어요';
      html += '</div>';
    }
    html += '</div></div>';
  });
  el.innerHTML = html;
}

// ---------- render: EXAM D-day ----------
function renderExam(){
  var el = document.getElementById('view-exam');
  if(state.settings.classes.length===0){
    el.innerHTML = emptyStateHtml('⏳','시험 D-day','설정에서 반과 학사일정을 먼저 등록해주세요.','settings');
    return;
  }
  if(state.settings.exams.length===0){
    el.innerHTML = '<h1 style="margin:6px 0 16px;">시험 D-day</h1><div class="empty-state"><div class="big-emoji">🚩</div><h2>등록된 시험이 없어요</h2><p>설정 &gt; 학사일정에서 모의고사·지필평가·수행평가를 추가해보세요.</p></div>';
    return;
  }
  var today = todayStr();
  var html = '<h1 style="margin:6px 0 16px;">시험 D-day</h1>';
  ['writtenExam','mock','performance'].forEach(function(type){
    var list = state.settings.exams.filter(function(e){ return e.type===type; })
      .slice().sort(function(a,b){ return a.startDate<b.startDate?-1:1; });
    if(!list.length) return;
    html += '<h3 style="margin:14px 0 8px;font-size:15px;color:var(--ink-soft);">'+EXAM_TYPES[type]+'</h3>';
    list.forEach(function(ex){
      var diff = Math.ceil((parseDate(ex.startDate)-parseDate(today))/86400000);
      var ddayText = diff===0?'D-DAY':(diff>0?('D-'+diff):('D+'+(-diff)));
      var dateLabel = ex.startDate===ex.endDate
        ? (niceDate(ex.startDate)+' ('+dayKorOf(ex.startDate)+')')
        : (niceDate(ex.startDate)+' ~ '+niceDate(ex.endDate));
      html += '<div class="exam-card"><div class="exam-top"><span class="exam-name">'+escapeHtml(ex.name)+'</span><span class="dday">'+ddayText+'</span></div>';
      html += '<div class="exam-date">'+dateLabel+'</div>';
      if(type==='writtenExam'){
        state.settings.classes.forEach(function(c){
          var st = classStats(c.id);
          var remain = st.total - st.done;
          var sessions = diff>0 ? countSessions(c.id, today, ex.startDate) : 0;
          var tag='', tagClass='';
          if(st.total===0){ tag='진도계획 없음'; tagClass='tight'; }
          else if(remain<=0){ tag='진도 완료'; tagClass='ok'; }
          else if(diff<=0){ tag='시험 지남'; tagClass='danger'; }
          else if(sessions===0){ tag='남은 수업 없음'; tagClass='danger'; }
          else {
            var pace = remain/sessions;
            if(pace<=1){ tag='여유 있어요'; tagClass='ok'; }
            else if(pace<=1.8){ tag='1회당 '+pace.toFixed(1)+'개씩'; tagClass='tight'; }
            else { tag='1회당 '+pace.toFixed(1)+'개씩 (빠듯)'; tagClass='danger'; }
          }
          html += '<div class="pace-row"><span class="cname" style="color:'+darken(c.color,0.45)+'">'+escapeHtml(c.name)+'</span>'+
            '<span>남은 '+Math.max(remain,0)+'개 · 수업 '+sessions+'회</span>'+
            '<span class="pace-tag '+tagClass+'">'+tag+'</span></div>';
        });
      }
      html += '</div>';
    });
  });
  el.innerHTML = html;
}

function renderSettingsSchedule(body){
  var n = state.settings.periodsPerDay;

  html += '<div class="field-row" style="max-width:160px;"><label>하루 교시 수</label>'+

    html += '<p class="small-note">먼저 반을 등록해주세요.</p></div>';
    body.innerHTML = html; return;
  }
  html += '<div class="sched-scroll"><table class="sched-table"><thead><tr><th></th>';
  DAYS.forEach(function(d){ html += '<th>'+d+'</th>'; });
  html += '</tr></thead><tbody>';
  for(var p=0; p<n; p++){
    html += '<tr><th>'+(p+1)+'교시</th>';
    DAYS.forEach(function(d){
      var val = state.settings.schedule[d][p] || '';
      html += '<td><select data-day="'+d+'" data-period="'+p+'"><option value="">-</option>';
      state.settings.classes.forEach(function(c){
        html += '<option value="'+c.id+'"'+(val===c.id?' selected':'')+'>'+escapeHtml(c.name)+'</option>';
      });
      html += '</select></td>';
    });
    html += '</tr>';
  }
  html += '</tbody></table></div></div>';
  body.innerHTML = html;

  document.getElementById('periodsInput').addEventListener('change', function(){
    var v = Math.max(1, Math.min(10, parseInt(this.value,10)||7));
    state.settings.periodsPerDay = v;
    DAYS.forEach(function(d){
      var arr = state.settings.schedule[d];
      while(arr.length<v) arr.push(null);
      arr.length = v;
    });
    saveSettings().then(function(){ renderSettingsSchedule(body); flashSaved(); });
  });
  body.querySelectorAll('select[data-day]').forEach(function(sel){
    sel.addEventListener('change', function(){
      var d = sel.getAttribute('data-day'), p = parseInt(sel.getAttribute('data-period'),10);
      state.settings.schedule[d][p] = sel.value || null;
      saveSettings().then(flashSaved);
    });
  });

      '<span class="'+(h.source==='auto'?'del-auto-h':'del-h')+'" data-date="'+h.date+'">✕</span></div>';
  });
  var excluded = state.settings.holidayExceptions.filter(function(d){ return LEGAL_HOLIDAYS.some(function(h){return h.date===d;}); });
  if(excluded.length){
    html += '<p class="small-note" style="margin-top:10px;">제외한 공휴일</p>';
    excluded.sort().forEach(function(d){
      var h = findAutoHoliday(d);
      html += '<div class="list-row" style="opacity:.6;"><div class="grow">'+niceDate(d)+' · '+escapeHtml(h?h.name:'')+'</div>'+
        '<span class="restore-h" data-date="'+d+'" style="font-size:12px;text-decoration:underline;cursor:pointer;color:var(--sage-deep);">복원</span></div>';
    });
  }
  listEl.innerHTML = html || '<p class="small-note">등록된 휴업일이 없어요.</p>';

  listEl.querySelectorAll('.del-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      state.settings.holidays = state.settings.holidays.filter(function(h){ return h!==dt; });
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
    });
  });
  listEl.querySelectorAll('.del-auto-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      if(state.settings.holidayExceptions.indexOf(dt)===-1) state.settings.holidayExceptions.push(dt);
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
    });
  });
  listEl.querySelectorAll('.restore-h').forEach(function(x){
    x.addEventListener('click', function(){
      var dt = x.getAttribute('data-date');
      state.settings.holidayExceptions = state.settings.holidayExceptions.filter(function(d){ return d!==dt; });
      saveSettings().then(function(){ renderHolidayMergedList(body); flashSaved(); });
    });
  });
}

function renderSettingsPlans(body){
  if(state.settings.classes.length===0){
    body.innerHTML = '<p class="small-note">먼저 반을 등록해주세요.</p>';
    return;
  }
  if(!state.planClassId || !getClass(state.planClassId)){
    state.planClassId = state.settings.classes[0].id;
  }
  var html = '<div class="tab-pills">';
  state.settings.classes.forEach(function(c){
    html += '<div class="tab-pill'+(state.planClassId===c.id?' active':'')+'" data-cid="'+c.id+'" style="'+(state.planClassId===c.id?('background:'+c.color+'22;color:'+c.color+';border-color:'+c.color):'')+'">'+escapeHtml(c.name)+'</div>';
  });
  html += '</div>';
  var otherClasses = state.settings.classes.filter(function(c){ return c.id!==state.planClassId; });
  if(otherClasses.length){
    html += '<div class="settings-section"><h3>다른 반 계획 복사</h3>';
    html += '<p class="small-note">다른 반과 진도 계획이 같다면, 여기서 불러와 지금 반 목록 뒤에 이어 붙여요.</p>';
    html += '<div class="add-row"><select id="copyFromClass">';
    otherClasses.forEach(function(c){ html += '<option value="'+c.id+'">'+escapeHtml(c.name)+'</option>'; });
    html += '</select><button class="btn ghost small" id="copyPlanBtn">복사해오기</button></div></div>';
  }
  html += '<div class="settings-section"><h3>진도 계획 순서</h3>';
  html += '<p class="small-note">단원/차시 순서대로 미리 입력해두면, [오늘] 화면에서 항목을 골라 체크할 수 있어요.</p>';
  var items = state.plans[state.planClassId] || [];
  items.forEach(function(it, idx){
    html += '<div class="list-row plan-item-row'+(it.done?' done':'')+'">';
    html += '<div class="updown"><span data-act="up" data-id="'+it.id+'">▲</span><span data-act="down" data-id="'+it.id+'">▼</span></div>';
    html += '<div class="grow">'+(idx+1)+'. '+escapeHtml(it.title)+(it.targetPage?(' <span class="sub">('+escapeHtml(it.targetPage)+')</span>'):'')+'</div>';
    html += '<span class="del-item" data-id="'+it.id+'">✕</span></div>';
  });
  html += '<div class="add-row"><input type="text" id="planTitle" placeholder="예: 2단원 이차방정식" style="flex:1.4">'+
    '<input type="text" id="planPage" placeholder="목표쪽수" style="max-width:90px"></div>'+
    '<button class="btn small" id="addPlanBtn" style="margin-top:8px;">항목 추가</button></div>';
  body.innerHTML = html;

  body.querySelectorAll('.tab-pill').forEach(function(p){
    p.addEventListener('click', function(){ state.planClassId = p.getAttribute('data-cid'); renderSettingsPlans(body); });
  });
  var copyBtn = document.getElementById('copyPlanBtn');
  if(copyBtn){
    copyBtn.addEventListener('click', function(){
      var fromId = document.getElementById('copyFromClass').value;
      var srcItems = state.plans[fromId] || [];
      if(!srcItems.length) return;
      var copied = srcItems.map(function(it){
        return { id:uid(), title:it.title, targetPage:it.targetPage||'', done:false, status:'pending', doneDate:null, donePage:'' };
      });
      if(!state.plans[state.planClassId]) state.plans[state.planClassId] = [];
      state.plans[state.planClassId] = state.plans[state.planClassId].concat(copied);
      savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
    });
  }
  body.querySelectorAll('.del-item').forEach(function(x){
    x.addEventListener('click', function(){
      var arr = state.plans[state.planClassId];
      state.plans[state.planClassId] = arr.filter(function(i){ return i.id!==x.getAttribute('data-id'); });
      savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
    });
  });
  body.querySelectorAll('[data-act]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var arr = state.plans[state.planClassId];
      var id = btn.getAttribute('data-id');
      var i = arr.findIndex(function(x){ return x.id===id; });
      var dir = btn.getAttribute('data-act')==='up'?-1:1;
      var j = i+dir;
      if(j<0||j>=arr.length) return;
      var tmp = arr[i]; arr[i]=arr[j]; arr[j]=tmp;
      savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
    });
  });
  document.getElementById('addPlanBtn').addEventListener('click', function(){
    var title = document.getElementById('planTitle').value.trim();
    var page = document.getElementById('planPage').value.trim();
    if(!title) return;
    if(!state.plans[state.planClassId]) state.plans[state.planClassId]=[];
    state.plans[state.planClassId].push({ id:uid(), title:title, targetPage:page, done:false, status:'pending', doneDate:null, donePage:'' });
    savePlans().then(function(){ renderSettingsPlans(body); flashSaved(); });
  });
}

// ---------- nav ----------
function renderAll(){
  renderToday();
  renderCalendar();
  renderClasses();
  renderExam();
  renderSettings();
}
function switchView(name){
  state.currentView = name;
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-view')===name);
  });
  if(name==='today') renderToday();
  else if(name==='calendar') renderCalendar();
  else if(name==='classes') renderClasses();
  else if(name==='exam') renderExam();
  else if(name==='settings') renderSettings();
}
window.__gotoView = switchView;

document.querySelectorAll('.nav-btn').forEach(function(b){
  b.addEventListener('click', function(){ switchView(b.getAttribute('data-view')); });
});

// ---------- init ----------
function init(){
  Promise.all([
    loadJSON('settings', null),
    loadJSON('plans', {})
  ]).then(function(res){
    state.settings = res[0] || defaultSettings();
    if(!state.settings.holidays) state.settings.holidays = [];
    if(!state.settings.exams) state.settings.exams = [];
    if(!state.settings.semesters) state.settings.semesters = [];
    if(state.settings.autoHolidaysEnabled === undefined) state.settings.autoHolidaysEnabled = true;
    if(!state.settings.holidayExceptions) state.settings.holidayExceptions = [];
    state.settings.exams = state.settings.exams.map(function(e){
      if(e.type && e.startDate) return e;
      return { id:e.id||uid(), type:'writtenExam', name:e.name, startDate:e.date||e.startDate, endDate:e.date||e.endDate||e.startDate };
    });
    state.plans = res[1] || {};
    Object.keys(state.plans).forEach(function(cid){
      (state.plans[cid]||[]).forEach(function(it){
        if(!it.status) it.status = it.done ? 'done' : 'pending';
      });
    });
    return ensureMonth(ymOf(state.currentDate));
  }).then(function(){
    renderAll();
  }).catch(function(e){
    console.error(e);
    state.settings = defaultSettings();
    state.plans = {};
    renderAll();
  });
}
init();

})();
</script>
</body>
</html>
